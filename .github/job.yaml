apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: ${KUBE_NAMESPACE}
  annotations:
    creator: "${KUBE_USERNAME}"
spec:
  ttlSecondsAfterFinished: 0
  activeDeadlineSeconds: 21600
  backoffLimit: 1
  template:
    metadata:
      labels:
        git-sha: ${GIT_SHA}
        github-event: ${EVENT_NAME}
      annotations:
        sidecar.istio.io/inject: "false"
        creator: "${KUBE_USERNAME}"
    spec:
      nodeSelector:
          mlx.navercorp.com/zone: ${MLXP_ZONE}
      restartPolicy: Never
      imagePullSecrets:
        - name: regcred
      volumes:
        - name: postfix-state
          emptyDir: {}
        - name: gmail-smtp-relay
          secret:
            secretName: gmail-smtp-relay
      containers:
        - name: heavyedge-feature-models
          image: ${DOCKER_REGISTRY}/${DOCKER_USERNAME}/heavyedge/feature-models:${DOCKER_TAG}
          imagePullPolicy: Always
          resources:
            requests:
              memory: "4Gi"
              cpu: "${CPU_REQUEST}"
              nvidia.com/gpu: "${GPU_REQUEST}"
            limits:
              memory: "16Gi"
              cpu: "${CPU_REQUEST}"
              nvidia.com/gpu: "${GPU_REQUEST}"
          command: ["sh", ".github/scripts/deploy.sh"]
          volumeMounts:
            - name: postfix-state
              mountPath: /var/run/heavyedge
          env:
            - name: JOB_NAME
              value: "${JOB_NAME}"
            - name: GIT_SHA
              value: "${GIT_SHA}"
            - name: GITHUB_REPOSITORY
              value: "${GITHUB_REPOSITORY}"
            - name: GITHUB_RUN_URL
              value: "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            - name: TAG_NAME
              value: "${RELEASE_TAG_NAME}"
            - name: EVENT_NAME
              value: "${EVENT_NAME}"
            - name: HEAVYEDGE_TEST_MODE
              value: "${HEAVYEDGE_TEST_MODE}"
            - name: UPLOAD_TO_HUGGINGFACE
              value: "${UPLOAD_TO_HUGGINGFACE}"
            - name: PUSH_DOC
              value: "${PUSH_DOC}"
            - name: GIT_AUTHOR_NAME
              value: "${GIT_AUTHOR_NAME}"
            - name: GIT_AUTHOR_EMAIL
              value: "${GIT_AUTHOR_EMAIL}"
            - name: HUGGINGFACE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: huggingface-token
                  key: HUGGINGFACE_TOKEN
                  optional: true
        - name: email-notify
          image: ${DOCKER_REGISTRY}/${DOCKER_USERNAME}/heavyedge/feature-models:${DOCKER_TAG}
          imagePullPolicy: Always
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
          command: ["sh", ".github/scripts/notify-deploy-sidecar.sh"]
          volumeMounts:
            - name: postfix-state
              mountPath: /var/run/heavyedge
          env:
            - name: JOB_NAME
              value: "${JOB_NAME}"
            - name: GIT_SHA
              value: "${GIT_SHA}"
            - name: GITHUB_REPOSITORY
              value: "${GITHUB_REPOSITORY}"
            - name: GITHUB_RUN_URL
              value: "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            - name: TAG_NAME
              value: "${RELEASE_TAG_NAME}"
            - name: EVENT_NAME
              value: "${EVENT_NAME}"
            - name: HEAVYEDGE_TEST_MODE
              value: "${HEAVYEDGE_TEST_MODE}"
            - name: UPLOAD_TO_HUGGINGFACE
              value: "${UPLOAD_TO_HUGGINGFACE}"
            - name: PUSH_DOC
              value: "${PUSH_DOC}"
            - name: SMTP_HOST
              value: "127.0.0.1"
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_NOTIFY_TO
              value: "${SMTP_NOTIFY_TO}"
            - name: SMTP_MAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: gmail-smtp-relay
                  key: GMAIL_USERNAME
        - name: github-check-run
          image: ${DOCKER_REGISTRY}/${DOCKER_USERNAME}/heavyedge/feature-models:${DOCKER_TAG}
          imagePullPolicy: Always
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
          command: ["sh", ".github/scripts/github-check-run-sidecar.sh"]
          volumeMounts:
            - name: postfix-state
              mountPath: /var/run/heavyedge
          env:
            - name: JOB_NAME
              value: "${JOB_NAME}"
            - name: GIT_SHA
              value: "${GIT_SHA}"
            - name: GITHUB_REPOSITORY
              value: "${GITHUB_REPOSITORY}"
            - name: GITHUB_RUN_URL
              value: "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            - name: GITHUB_CHECK_RUN_ID
              value: "${GITHUB_CHECK_RUN_ID}"
            - name: GH_APP_ID
              valueFrom:
                secretKeyRef:
                  name: github-app
                  key: GH_APP_ID
                  optional: true
            - name: GH_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: github-app
                  key: GH_APP_PRIVATE_KEY
                  optional: true
            - name: GH_APP_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: github-app
                  key: GH_APP_INSTALLATION_ID
                  optional: true
        - name: postfix
          image: boky/postfix:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
          ports:
            - name: smtp
              containerPort: 587
          command: ["/bin/sh", "-c"]
          args:
            - |
              /scripts/run.sh &
              postfix_pid=$!
              while [ ! -f /var/run/heavyedge/notify-deploy-complete ]; do
                if ! kill -0 "${postfix_pid}" 2>/dev/null; then
                  wait "${postfix_pid}"
                  exit $?
                fi
                sleep 5
              done
              postfix stop || true
              kill "${postfix_pid}" 2>/dev/null || true
              wait "${postfix_pid}" 2>/dev/null || true
          env:
            - name: RELAYHOST
              value: "[smtp.gmail.com]:587"
            - name: RELAYHOST_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gmail-smtp-relay
                  key: GMAIL_USERNAME
            - name: RELAYHOST_PASSWORD_FILE
              value: "/run/secrets/gmail/GMAIL_APP_PASSWORD"
            - name: POSTFIX_smtp_tls_security_level
              value: "encrypt"
            - name: POSTFIX_mynetworks
              value: "127.0.0.0/8 [::1]/128"
            - name: ALLOW_EMPTY_SENDER_DOMAINS
              value: "true"
            - name: LOG_FORMAT
              value: "json"
          volumeMounts:
            - name: postfix-state
              mountPath: /var/run/heavyedge
            - name: gmail-smtp-relay
              mountPath: /run/secrets/gmail
              readOnly: true
