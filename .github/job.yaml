apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: ${KUBE_NAMESPACE}
spec:
  ttlSecondsAfterFinished: 0
  activeDeadlineSeconds: 10800
  backoffLimit: 1
  template:
    metadata:
      labels:
        git-sha: ${GIT_SHA}
        github-event: ${EVENT_NAME}
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      nodeSelector:
          mlx.navercorp.com/zone: ${MLXP_ZONE}
      restartPolicy: Never
      imagePullSecrets:
        - name: regcred
      containers:
        - name: main
          image: ${DOCKER_REGISTRY}/${DOCKER_USERNAME}/heavyedge/feature-models:${DOCKER_TAG}
          imagePullPolicy: Always
          resources:
            limits:
              memory: "8Gi"
              cpu: "4"
              nvidia.com/gpu: "1"
          command: ["sh", ".github/scripts/deploy-model.sh"]
          env:
            - name: GIT_SHA
              value: "${GIT_SHA}"
            - name: HEAVYEDGE_TEST_MODE
              value: "${HEAVYEDGE_TEST_MODE}"
            - name: UPLOAD_TO_HUGGINGFACE
              value: "${UPLOAD_TO_HUGGINGFACE}"
            - name: HUGGINGFACE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: huggingface-token
                  key: HUGGINGFACE_TOKEN
                  optional: true
