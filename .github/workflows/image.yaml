name: Image

on:
  repository_dispatch:
    types:
      - GPU-completed

permissions:
  contents: read

jobs:

  download-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check dispatch payload
        id: payload
        shell: bash
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_OUTPUT"
          import json
          import os

          payload = json.loads(os.environ["CLIENT_PAYLOAD"])
          model = payload.get("model") or {}

          model_url = model.get("url") or ""
          model_revision = model.get("revision") or ""
          has_model = bool(model_url and model_revision)

          print(f"model_url={model_url}", flush=True)
          print(f"model_revision={model_revision}", flush=True)
          print(f"has_model={str(has_model).lower()}", flush=True)
          PY

      - name: Download pushed model
        if: steps.payload.outputs.has_model == 'true'
        shell: bash
        run: |
            curl -LsSf https://hf.co/cli/install.sh | bash
            hf auth login --token $HUGGINGFACE_TOKEN
            hf download "$MODEL_REPO_URL" --repo-type model --revision "$MODEL_REVISION" --local-dir model
        env:
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          MODEL_REPO_URL: ${{ steps.payload.outputs.model_url }}
          MODEL_REVISION: ${{ steps.payload.outputs.model_revision }}

      - uses: actions/upload-artifact@v4
        if: steps.payload.outputs.has_model == 'true'
        with:
          name: model
          path: model/*
          retention-days: 1

  publish-image:
    if: steps.payload.outputs.has_model == 'true'
    needs: download-model
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: model
          path: model

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker registry
        shell: bash
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          for attempt in 1 2; do
            if printf '%s' "$DOCKER_PASSWORD" | docker login "$DOCKER_REGISTRY" --username "$DOCKER_USERNAME" --password-stdin; then
              exit 0
            fi

            if [ "$attempt" -lt 2 ]; then
              echo "Docker login failed. Retrying in 3 seconds..."
              sleep 3
            fi
          done

          echo "Docker login failed after 2 attempts."
          exit 1

      - name: Build and push temporary Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=feature-models
          cache-to: type=gha,mode=max,scope=feature-models
          build-args: |
            IMAGE_CREATED=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            IMAGE_VERSION=${{ steps.docker-tags.outputs.tag_name }}
            IMAGE_REVISION=${{ github.sha }}
          tags: "${DOCKER_REGISTRY}/${DOCKER_USERNAME}/heavyedge/feature-models:${{ steps.payload.outputs.model_revision }}"
