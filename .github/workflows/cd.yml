name: CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  release:
    types: [published]

permissions:
  actions: write
  checks: write
  contents: read

jobs:

  create-check:

    runs-on: ubuntu-latest

    outputs:
      check-run-id: ${{ steps.gpu-check.outputs.check-run-id }}
      docker-tag: ${{ steps.k8s-job.outputs.docker_tag }}
      job-name: ${{ steps.k8s-job.outputs.job_name }}
      cpu-request: ${{ steps.k8s-job.outputs.cpu_request }}
      gpu-request: ${{ steps.k8s-job.outputs.gpu_request }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Kubernetes job metadata
        id: k8s-job
        shell: bash
        env:
          GIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAVYEDGE_TEST_MODE: ${{ github.event_name == 'release' && '0' || '1' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            docker_tag="latest-dev"
            job_name="heavyedge-feature-models-release-${GIT_SHA::7}"
          else
            docker_tag="${GIT_SHA::7}-dev"
            job_name="heavyedge-feature-models-cd-${GIT_SHA::7}"
          fi

          if [ "$HEAVYEDGE_TEST_MODE" = "1" ]; then
            cpu_request="1"
            gpu_request="1"
          else
            cpu_request="2"
            gpu_request="4"
          fi

          {
            echo "docker_tag=${docker_tag}"
            echo "job_name=${job_name}"
            echo "cpu_request=${cpu_request}"
            echo "gpu_request=${gpu_request}"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub App token for GPU check
        id: gpu-check-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-checks: write

      - name: Create GPU check
        id: gpu-check
        uses: actions/github-script@v9
        env:
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          JOB_NAME: ${{ steps.k8s-job.outputs.job_name }}
        with:
          github-token: ${{ steps.gpu-check-token.outputs.token }}
          script: |
            const checkName = 'GPU';
            const response = await github.rest.checks.create({
              ...context.repo,
              name: checkName,
              head_sha: process.env.GIT_SHA,
              external_id: process.env.JOB_NAME,
              status: 'in_progress',
              started_at: new Date().toISOString(),
              details_url: process.env.GITHUB_RUN_URL,
              output: {
                title: checkName,
                summary: 'Kubernetes GPU job started.',
              },
            });

            core.setOutput('check-run-id', String(response.data.id));

  publish-image:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker registry
        shell: bash
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          for attempt in 1 2; do
            if printf '%s' "$DOCKER_PASSWORD" | docker login "$DOCKER_REGISTRY" --username "$DOCKER_USERNAME" --password-stdin; then
              exit 0
            fi

            if [ "$attempt" -lt 2 ]; then
              echo "Docker login failed. Retrying in 3 seconds..."
              sleep 3
            fi
          done

          echo "Docker login failed after 2 attempts."
          exit 1

      - name: Set Docker image tags
        id: docker-tags
        shell: bash
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
        run: |
          image="${DOCKER_REGISTRY}/${DOCKER_USERNAME}/heavyedge/feature-models"

          {
            echo 'tags<<EOF'
            if [ "$EVENT_NAME" = "release" ]; then
              echo "${image}:latest-dev"
            else
              echo "${image}:${GIT_SHA::7}-dev"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          target: dev
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=feature-models-dev
          cache-to: type=gha,mode=max,scope=feature-models-dev
          build-args: |
            IMAGE_CREATED=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            IMAGE_VERSION=${{ github.ref_name }}
            IMAGE_REVISION=${{ github.sha }}
          secrets: |
            hf_token=${{ secrets.HUGGINGFACE_TOKEN }}
          tags: ${{ steps.docker-tags.outputs.tags }}

  deploy-GPU:

    needs:
      - create-check
      - publish-image

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Resolve notification recipient
        id: notification-recipient
        uses: actions/github-script@v9
        env:
          GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          NOTIFY_EMAIL_MAP: ${{ vars.SMTP_NOTIFY_EMAIL_MAP }}
        with:
          script: |
            const noreplyPattern = /(^|@)(users\.)?noreply\.github\.com$/i;
            const usableEmail = (email) => email && !noreplyPattern.test(email);

            let emailMap = {};
            if (process.env.NOTIFY_EMAIL_MAP) {
              try {
                emailMap = JSON.parse(process.env.NOTIFY_EMAIL_MAP);
              } catch (error) {
                core.warning(`Ignoring invalid SMTP_NOTIFY_EMAIL_MAP JSON: ${error.message}`);
              }
            }

            const { data: commit } = await github.rest.repos.getCommit({
              ...context.repo,
              ref: process.env.GIT_SHA,
            });

            const candidates = [
              context.payload.pull_request?.user?.login,
              context.payload.release?.author?.login,
              commit.author?.login,
              commit.committer?.login,
              context.actor,
            ].filter(Boolean);
            const login = [...new Set(candidates)][0];

            if (login && emailMap[login]) {
              core.setOutput('email', emailMap[login]);
              return;
            }

            if (login) {
              const { data: user } = await github.rest.users.getByUsername({ username: login });
              if (usableEmail(user.email)) {
                core.setOutput('email', user.email);
                return;
              }
            }

            const commitEmails = [
              commit.commit.author?.email,
              commit.commit.committer?.email,
            ];
            const commitEmail = commitEmails.find(usableEmail);
            if (commitEmail) {
              core.setOutput('email', commitEmail);
              return;
            }

            core.warning(
              `Could not resolve a public notification email for ${login || 'the commit author'}; deployment email notification will be skipped.`
            );
            core.setOutput('email', '');

      - name: Create image pull secret
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          kubectl create secret docker-registry regcred \
            --docker-server="$DOCKER_REGISTRY" \
            --docker-username="$DOCKER_USERNAME" \
            --docker-password="$DOCKER_PASSWORD" \
            --namespace=${{ secrets.KUBE_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create Docker registry cleanup secret
        if: ${{ github.event_name != 'release' }}
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          kubectl create secret generic docker-registry-cleanup \
            --from-literal=DOCKER_USERNAME="$DOCKER_USERNAME" \
            --from-literal=DOCKER_PASSWORD="$DOCKER_PASSWORD" \
            --namespace="$KUBE_NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create Gmail relay secret
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          if [ -z "$GMAIL_USERNAME" ]; then
            echo "::error::Missing GMAIL_USERNAME secret for SMTP relay."
            exit 1
          fi
          if [ -z "$GMAIL_APP_PASSWORD" ]; then
            echo "::error::Missing GMAIL_APP_PASSWORD secret for SMTP relay."
            exit 1
          fi

          kubectl create secret generic gmail-smtp-relay \
            --from-literal=GMAIL_USERNAME="$GMAIL_USERNAME" \
            --from-literal=GMAIL_APP_PASSWORD="$GMAIL_APP_PASSWORD" \
            --namespace="$KUBE_NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Set release upload policy
        id: release-policy
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          upload_to_huggingface=0

          if [ "$EVENT_NAME" = "release" ]; then
            if [[ "$REF_NAME" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              upload_to_huggingface=1
            fi
          fi

          echo "UPLOAD_TO_HUGGINGFACE=$upload_to_huggingface"
          echo "upload_to_huggingface=$upload_to_huggingface" >> "$GITHUB_OUTPUT"

      - name: Create Hugging Face token secret
        if: steps.release-policy.outputs.upload_to_huggingface == '1'
        env:
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          kubectl create secret generic huggingface-token \
            --from-literal=HUGGINGFACE_TOKEN="$HUGGINGFACE_TOKEN" \
            --namespace="$KUBE_NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create GitHub app secret
        env:
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          GH_APP_INSTALLATION_ID: ${{ secrets.GH_APP_INSTALLATION_ID }}
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          if [ -z "$GH_APP_ID" ]; then
            echo "::error::Missing GH_APP_ID secret for GitHub check runs and documentation branch pushes."
            exit 1
          fi
          if [ -z "$GH_APP_PRIVATE_KEY" ]; then
            echo "::error::Missing GH_APP_PRIVATE_KEY secret for GitHub check runs and documentation branch pushes."
            exit 1
          fi

          kubectl create secret generic github-app \
            --from-literal=GH_APP_ID="$GH_APP_ID" \
            --from-literal=GH_APP_PRIVATE_KEY="$GH_APP_PRIVATE_KEY" \
            --from-literal=GH_APP_INSTALLATION_ID="$GH_APP_INSTALLATION_ID" \
            --namespace="$KUBE_NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Run job
        id: run-job
        env:
          GIT_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          HEAVYEDGE_TEST_MODE: ${{ github.event_name == 'release' && '0' || '1' }}
          UPLOAD_TO_HUGGINGFACE: ${{ steps.release-policy.outputs.upload_to_huggingface }}
          PUSH_DOC: ${{ github.event_name == 'release' && '1' || '0' }}
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
          KUBE_USERNAME: ${{ secrets.KUBE_USERNAME }}
          MLXP_ZONE: ${{ secrets.MLXP_ZONE }}
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DELETE_TEMP_DOCKER_TAG: ${{ github.event_name != 'release' && '1' || '0' }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_CHECK_RUN_ID: ${{ needs.create-check.outputs.check-run-id }}
          SMTP_NOTIFY_TO: ${{ steps.notification-recipient.outputs.email }}
          RELEASE_TAG_NAME: ${{ github.ref_name }}
          GIT_AUTHOR_NAME: heavyedge-bot
          GIT_AUTHOR_EMAIL: heavyedge-bot@users.noreply.github.com
          DOCKER_TAG: ${{ needs.create-check.outputs.docker-tag }}
          JOB_NAME: ${{ needs.create-check.outputs.job-name }}
          CPU_REQUEST: ${{ needs.create-check.outputs.cpu-request }}
          GPU_REQUEST: ${{ needs.create-check.outputs.gpu-request }}
        run: |
          template_vars='$JOB_NAME $KUBE_NAMESPACE $KUBE_USERNAME $GIT_SHA $EVENT_NAME $MLXP_ZONE $DOCKER_REGISTRY $DOCKER_USERNAME $DOCKER_TAG $DELETE_TEMP_DOCKER_TAG $CPU_REQUEST $GPU_REQUEST $GITHUB_REPOSITORY $GITHUB_RUN_ID $GITHUB_CHECK_RUN_ID $RELEASE_TAG_NAME $HEAVYEDGE_TEST_MODE $UPLOAD_TO_HUGGINGFACE $PUSH_DOC $GIT_AUTHOR_NAME $GIT_AUTHOR_EMAIL $SMTP_NOTIFY_TO'
          envsubst "$template_vars" < .github/job-cd.yaml | kubectl apply -f -
          kubectl wait \
            --namespace="$KUBE_NAMESPACE" \
            --for=create \
            "pod" \
            --selector="job-name=${JOB_NAME}" \
            --timeout=120s

      - name: Create GitHub App token for GPU check failure
        if: ${{ failure() && needs.create-check.outputs.check-run-id != '' && steps.run-job.outcome == 'failure' }}
        id: gpu-check-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-checks: write

      - name: Fail GPU check when job startup fails
        if: ${{ failure() && needs.create-check.outputs.check-run-id != '' && steps.run-job.outcome == 'failure' }}
        uses: actions/github-script@v9
        env:
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_CHECK_RUN_ID: ${{ needs.create-check.outputs.check-run-id }}
        with:
          github-token: ${{ steps.gpu-check-token.outputs.token }}
          script: |
            const checkName = 'GPU';
            await github.rest.checks.update({
              ...context.repo,
              check_run_id: Number(process.env.GITHUB_CHECK_RUN_ID),
              status: 'completed',
              conclusion: 'failure',
              completed_at: new Date().toISOString(),
              details_url: process.env.GITHUB_RUN_URL,
              output: {
                title: checkName,
                summary: 'Kubernetes GPU job failed.',
              },
            });

      - name: Delete temporary Docker image when job startup fails
        if: ${{ failure() && github.event_name != 'release' && steps.run-job.outcome == 'failure' }}
        shell: bash
        env:
          DELETE_TEMP_DOCKER_TAG: "1"
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_REPOSITORY: ${{ secrets.DOCKER_USERNAME }}/heavyedge/feature-models
          DOCKER_TAG: ${{ needs.create-check.outputs.docker-tag }}
        run: |
          sh .github/scripts/delete-image.sh

  post-fail-deploy:

    needs:
      - create-check
      - publish-image
      - deploy-GPU

    if: ${{ always() && needs.create-check.outputs.check-run-id != '' && (needs.publish-image.result == 'failure' || needs.publish-image.result == 'cancelled' || needs.deploy-GPU.result == 'failure' || needs.deploy-GPU.result == 'cancelled') }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub App token for GPU check
        id: gpu-check-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-checks: write

      - name: Fail GPU check
        uses: actions/github-script@v9
        env:
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_CHECK_RUN_ID: ${{ needs.create-check.outputs.check-run-id }}
        with:
          github-token: ${{ steps.gpu-check-token.outputs.token }}
          script: |
            const checkName = 'GPU';
            await github.rest.checks.update({
              ...context.repo,
              check_run_id: Number(process.env.GITHUB_CHECK_RUN_ID),
              status: 'completed',
              conclusion: 'failure',
              completed_at: new Date().toISOString(),
              details_url: process.env.GITHUB_RUN_URL,
              output: {
                title: checkName,
                summary: 'Kubernetes GPU job failed.',
              },
            });

      - name: Delete temporary Docker image
        if: ${{ github.event_name != 'release' }}
        shell: bash
        env:
          DELETE_TEMP_DOCKER_TAG: "1"
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_REPOSITORY: ${{ secrets.DOCKER_USERNAME }}/heavyedge/feature-models
          DOCKER_TAG: ${{ needs.create-check.outputs.docker-tag }}
        run: |
          sh .github/scripts/delete-image.sh
