name: CD

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:

  docker-dev:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve latest release tag
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          tag="$(gh api "repos/${REPOSITORY}/releases/latest" --jq '.tag_name')" || {
            echo "No latest GitHub release found for ${REPOSITORY}."
            exit 1
          }

          if [ -z "$tag" ]; then
            echo "Latest release tag is empty."
            exit 1
          fi

          created="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "created=$created" >> "$GITHUB_OUTPUT"

      - name: Login to Docker registry
        shell: bash
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          for attempt in 1 2; do
            if printf '%s' "$DOCKER_PASSWORD" | docker login "$DOCKER_REGISTRY" --username "$DOCKER_USERNAME" --password-stdin; then
              exit 0
            fi

            if [ "$attempt" -lt 2 ]; then
              echo "Docker login failed. Retrying in 3 seconds..."
              sleep 3
            fi
          done

          echo "Docker login failed after 2 attempts."
          exit 1

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          target: dev
          build-args: |
            IMAGE_CREATED=${{ steps.release.outputs.created }}
            IMAGE_VERSION=${{ steps.release.outputs.tag }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_TITLE='HeavyEdge Feature Models (dev)'
            IMAGE_DESCRIPTION='Image for developing heavyedge/feature-models. Includes source in '/src' directory. Does not include trained models.'
          secrets: |
            hf_token=${{ secrets.HUGGINGFACE_TOKEN }}
          tags: ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/heavyedge-feature-models:dev
