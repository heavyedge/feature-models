name: CD

on:
  push:
    branches:
      - master
  release:
    types: [published]

permissions:
  contents: read

jobs:

  publish-image:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker registry
        shell: bash
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          for attempt in 1 2; do
            if printf '%s' "$DOCKER_PASSWORD" | docker login "$DOCKER_REGISTRY" --username "$DOCKER_USERNAME" --password-stdin; then
              exit 0
            fi

            if [ "$attempt" -lt 2 ]; then
              echo "Docker login failed. Retrying in 3 seconds..."
              sleep 3
            fi
          done

          echo "Docker login failed after 2 attempts."
          exit 1

      - name: Set Docker image tags
        id: docker-tags
        shell: bash
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          image="${DOCKER_REGISTRY}/${DOCKER_USERNAME}/heavyedge/feature-models"

          {
            echo 'tags<<EOF'
            echo "${image}:dev-latest"
            if [ "$EVENT_NAME" = "release" ]; then
              echo "${image}:dev-${REF_NAME}"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          target: dev
          platforms: linux/amd64,linux/arm64
          build-args: |
            IMAGE_CREATED=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            IMAGE_VERSION=${{ github.ref_name }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_TITLE='HeavyEdge Feature Models (dev)'
            IMAGE_DESCRIPTION='Image for developing heavyedge/feature-models. Includes source in '/src' directory. Does not include trained models.'
          secrets: |
            hf_token=${{ secrets.HUGGINGFACE_TOKEN }}
          tags: ${{ steps.docker-tags.outputs.tags }}

  deploy-k8s:

    needs: publish-image

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Create image pull secret
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          kubectl create secret docker-registry regcred \
            --docker-server="$DOCKER_REGISTRY" \
            --docker-username="$DOCKER_USERNAME" \
            --docker-password="$DOCKER_PASSWORD" \
            --namespace=${{ secrets.KUBE_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Set release upload policy
        id: release-policy
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          upload_to_huggingface=0

          if [ "$EVENT_NAME" = "release" ]; then
            upload_to_huggingface=1

            if [[ "$REF_NAME" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+\.post[0-9]+$ ]]; then
              upload_to_huggingface=0
            elif [[ ! "$REF_NAME" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::warning::Release tag '$REF_NAME' does not match versioning policy N.N.N[.postN]; defaulting UPLOAD_TO_HUGGINGFACE to 1."
            fi
          fi

          echo "UPLOAD_TO_HUGGINGFACE=$upload_to_huggingface"
          echo "upload_to_huggingface=$upload_to_huggingface" >> "$GITHUB_OUTPUT"

      - name: Create Hugging Face token secret
        if: steps.release-policy.outputs.upload_to_huggingface == '1'
        env:
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          kubectl create secret generic huggingface-token \
            --from-literal=HUGGINGFACE_TOKEN="$HUGGINGFACE_TOKEN" \
            --namespace="$KUBE_NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create GitHub app secret
        if: github.event_name == 'release'
        env:
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          GH_APP_INSTALLATION_ID: ${{ secrets.GH_APP_INSTALLATION_ID }}
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          if [ -z "$GH_APP_ID" ]; then
            echo "::error::Missing GH_APP_ID secret for documentation branch pushes."
            exit 1
          fi
          if [ -z "$GH_APP_PRIVATE_KEY" ]; then
            echo "::error::Missing GH_APP_PRIVATE_KEY secret for documentation branch pushes."
            exit 1
          fi

          kubectl create secret generic github-app \
            --from-literal=GH_APP_ID="$GH_APP_ID" \
            --from-literal=GH_APP_PRIVATE_KEY="$GH_APP_PRIVATE_KEY" \
            --from-literal=GH_APP_INSTALLATION_ID="$GH_APP_INSTALLATION_ID" \
            --namespace="$KUBE_NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Run job
        env:
          GIT_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          HEAVYEDGE_TEST_MODE: ${{ github.event_name == 'release' && '0' || '1' }}
          UPLOAD_TO_HUGGINGFACE: ${{ steps.release-policy.outputs.upload_to_huggingface }}
          PUSH_DOC: ${{ github.event_name == 'release' && '1' || '0' }}
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
          MLXP_ZONE: ${{ secrets.MLXP_ZONE }}
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          RELEASE_TAG_NAME: ${{ github.ref_name }}
        run: |
          export GIT_SHA_SHORT=${GIT_SHA::7}
          if [ "$EVENT_NAME" = "release" ]; then
            export DOCKER_TAG="dev-${RELEASE_TAG_NAME}"
            export JOB_NAME="heavyedge-feature-models-release-${GIT_SHA_SHORT}"
          else
            export DOCKER_TAG="dev-latest"
            export JOB_NAME="heavyedge-feature-models-${GIT_SHA_SHORT}"
          fi
          envsubst < .github/job.yaml | kubectl apply -f -
