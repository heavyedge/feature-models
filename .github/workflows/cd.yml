name: CD

on:
  push:
    branches:
      - master
  release:
    types: [published]

permissions:
  contents: read

jobs:

  publish-docker:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker registry
        shell: bash
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          for attempt in 1 2; do
            if printf '%s' "$DOCKER_PASSWORD" | docker login "$DOCKER_REGISTRY" --username "$DOCKER_USERNAME" --password-stdin; then
              exit 0
            fi

            if [ "$attempt" -lt 2 ]; then
              echo "Docker login failed. Retrying in 3 seconds..."
              sleep 3
            fi
          done

          echo "Docker login failed after 2 attempts."
          exit 1

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          target: dev
          build-args: |
            IMAGE_CREATED=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            IMAGE_VERSION=${{ github.ref_name }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_TITLE='HeavyEdge Feature Models (dev)'
            IMAGE_DESCRIPTION='Image for developing heavyedge/feature-models. Includes source in '/src' directory. Does not include trained models.'
          secrets: |
            hf_token=${{ secrets.HUGGINGFACE_TOKEN }}
          tags: ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/heavyedge/feature-models:dev

  deploy-k8s:

    needs: publish-docker

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Create image pull secret
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          kubectl create secret docker-registry regcred \
            --docker-server="$DOCKER_REGISTRY" \
            --docker-username="$DOCKER_USERNAME" \
            --docker-password="$DOCKER_PASSWORD" \
            --namespace=${{ secrets.KUBE_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Run job
        env:
          GIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAVYEDGE_TEST_MODE: ${{ github.event_name == 'release' && '0' || '1' }}
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
          MLXP_ZONE: ${{ secrets.MLXP_ZONE }}
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          export GIT_SHA_SHORT=${GIT_SHA::7}
          envsubst < .github/job.yaml | kubectl apply -f -
