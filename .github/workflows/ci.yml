name: CI

on:
  push:
  pull_request:

jobs:

  lint:

    runs-on: ubuntu-latest

    steps:

      - name: get repo
        uses: actions/checkout@v3

      - name: set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: set up uv
        uses: astral-sh/setup-uv@v5

      - name: install dependencies
        run: |
          uv pip install --system flake8 "black[jupyter]" isort

      - name: lint with flake8
        run: |
          flake8

      - name: lint with black
        run: |
          black --check .

      - name: lint with isort
        run: |
          isort --check .

  train-models:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - run: HEAVYEDGE_TEST_MODE=1 ./setup.sh
        env:
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}

      - name: build models
        run: HEAVYEDGE_TEST_MODE=1 make models

      - name: test models
        run: HEAVYEDGE_TEST_MODE=1 make tests

      - uses: actions/upload-artifact@v4
        with:
          name: data
          path: |
            _data/v1/dimless/**
            _data/v1/shape_features/**
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: models
          path: models
          retention-days: 1

  find-notebooks:

    runs-on: ubuntu-latest

    outputs:
      notebooks: ${{ steps.list.outputs.notebooks }}

    steps:

      - name: get repo
        uses: actions/checkout@v3

      - name: list notebooks
        id: list
        run: |
          notebooks=$(find examples -name "*.ipynb" | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "notebooks=$notebooks" >> $GITHUB_OUTPUT

  build-notebooks:

    needs:
      - train-models
      - find-notebooks

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        notebook: ${{ fromJson(needs.find-notebooks.outputs.notebooks) }}

    steps:

      - name: get repo
        uses: actions/checkout@v3

      - name: set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: set up uv
        uses: astral-sh/setup-uv@v5

      - name: install dependencies
        run: uv pip install --system -r requirements.txt -r examples/requirements.txt

      - uses: actions/download-artifact@v4
        with:
          name: data
          path: _data/v1

      - uses: actions/download-artifact@v4
        with:
          name: models
          path: models

      - run: HEAVYEDGE_TEST_MODE=1 make ${{ matrix.notebook }}

  test-model:

    needs: train-models

    runs-on: ubuntu-latest

    steps:

      - name: get repo
        uses: actions/checkout@v3

      - name: set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: set up uv
        uses: astral-sh/setup-uv@v5

      - uses: actions/download-artifact@v4
        with:
          name: models
          path: models

      - name: install package
        run: |
          for requirements in models/v*/requirements.txt; do
            uv pip install --system -r "$requirements"
          done

      - name: test models in inference environment
        run: HEAVYEDGE_TEST_MODE=1 make tests
