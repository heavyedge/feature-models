name: CI

on:
  push:
  pull_request:

jobs:

  lint:

    runs-on: ubuntu-latest

    steps:

      - name: get repo
        uses: actions/checkout@v3

      - name: set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: install dependencies
        run: |
          pip install flake8 "black[jupyter]" isort

      - name: lint with flake8
        run: |
          flake8

      - name: lint with black
        run: |
          black --check .

      - name: lint with isort
        run: |
          isort --check .

  models:

    name: models (${{ matrix.version }})

    strategy:
      fail-fast: false
      matrix:
        version: [v0, v1]

    uses: ./.github/workflows/ci-models.yml
    with:
      version: ${{ matrix.version }}
    secrets: inherit
