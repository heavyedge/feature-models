name: Doc

on:
  push:
    branches:
      - "*-doc"
      - "**/*-doc"

permissions:
  contents: read

concurrency:
  group: doc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event.deleted != true }}
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: heavyedge-bot
      GIT_AUTHOR_EMAIL: heavyedge-bot@users.noreply.github.com

    steps:
      - name: Resolve documentation version
        id: version
        shell: bash
        run: |
          ref_name="${GITHUB_REF_NAME}"
          if [[ ! "${ref_name}" =~ ^(.+)-doc$ ]]; then
            echo "Unsupported documentation branch: ${ref_name}" >&2
            exit 1
          fi

          version="${BASH_REMATCH[1]}"
          artifact_name="${version//\//-}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=${artifact_name}" >> "${GITHUB_OUTPUT}"
          echo "Documentation version: ${version}"

      - name: Checkout documentation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install documentation dependencies
        run: |
          uv pip install --system -r doc/requirements.txt

      - name: Build Sphinx documentation
        run: |
          python -m sphinx -b html doc/source doc/build/html

      - name: Upload Sphinx HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: sphinx-html-${{ steps.version.outputs.artifact_name }}
          path: doc/build/html
          if-no-files-found: error

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Restore Pages site state
        shell: bash
        env:
          GITHUB_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          mkdir -p pages-site
          git -C pages-site init -b gh-pages
          git -C pages-site remote add origin "https://x-access-token:${GITHUB_APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git -C pages-site ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git -C pages-site fetch --depth=1 origin gh-pages
            git -C pages-site reset --hard FETCH_HEAD
          fi

      - name: Stage versioned documentation
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          rm -rf "pages-site/${version}"
          mkdir -p "pages-site/${version}"
          cp -a doc/build/html/. "pages-site/${version}/"
          touch pages-site/.nojekyll

      - name: Stage root documentation redirect
        run: |
          cp .github/static/index.html pages-site/index.html

      - name: Stage documentation version metadata
        run: |
          python .github/scripts/doc-versions.py \
            --site-dir pages-site \
            --fallback-version "${{ steps.version.outputs.version }}"

      - name: Stage Pages workflow
        run: |
          mkdir -p pages-site/.github/workflows
          cp .github/workflows/pages.yml pages-site/.github/workflows/pages.yml

      - name: Persist Pages site state
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          git -C pages-site config user.name "${GIT_AUTHOR_NAME}"
          git -C pages-site config user.email "${GIT_AUTHOR_EMAIL}"
          git -C pages-site add .

          if git -C pages-site diff --cached --quiet; then
            echo "No Pages site changes to persist."
          else
            git -C pages-site commit -m "Deploy documentation for ${version}"
            git -C pages-site push origin HEAD:gh-pages
          fi

      - name: Delete documentation branch
        env:
          GITHUB_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git push "https://x-access-token:${GITHUB_APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ":refs/heads/${GITHUB_REF_NAME}"
