name: CI K8s

on:
  push:
    branches-ignore:
      - "*-doc"
      - "**/*-doc"
  pull_request:

permissions:
  contents: read

jobs:
  docker-image-deletion:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Docker image deletion scenarios
        shell: bash
        run: |
          python3 .github/k8s/tests/test-delete-image.py

  kubernetes-job-creation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      KUBE_NAMESPACE: heavyedge-cd-ci
      KUBE_USERNAME: github-actions
      MLXP_ZONE: ci-k8s
      HEAVYEDGE_TEST_MODE: "1"
      UPLOAD_TO_HUGGINGFACE: "0"
      PUSH_DOC: "0"
      DOCKER_REGISTRY: marker-registry.invalid
      DOCKER_USERNAME: ci
      DOCKER_TAG: placeholder
      TEMP_DOCKER_TAG: placeholder-temp
      CPU_REQUEST: "1"
      GPU_REQUEST: "0"
      GIT_AUTHOR_NAME: heavyedge-bot
      GIT_AUTHOR_EMAIL: heavyedge-bot@users.noreply.github.com
      SMTP_NOTIFY_TO: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: heavyedge-cd-ci
          wait: 120s

      - name: Install render dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext-base

      - name: Prepare Kubernetes namespace
        shell: bash
        run: |
          kubectl create namespace "$KUBE_NAMESPACE"
          kubectl label nodes --all "mlx.navercorp.com/zone=$MLXP_ZONE" --overwrite
          kubectl create secret docker-registry regcred \
            --docker-server=example.invalid \
            --docker-username=placeholder \
            --docker-password=placeholder \
            --namespace="$KUBE_NAMESPACE"
          kubectl create secret generic docker-registry-cleanup \
            --from-literal=DOCKER_USERNAME="$DOCKER_USERNAME" \
            --from-literal=DOCKER_PASSWORD=ci-password \
            --namespace="$KUBE_NAMESPACE"
          kubectl create secret generic gmail-smtp-relay \
            --from-literal=GMAIL_USERNAME=heavyedge-feature-models@localhost \
            --from-literal=GMAIL_APP_PASSWORD=placeholder \
            --namespace="$KUBE_NAMESPACE"

      - name: Render Kubernetes job with placeholder build
        id: render
        shell: bash
        env:
          JOB_NAME: heavyedge-cd-ci-${{ github.run_id }}-${{ github.run_attempt }}
          GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_GPU_BUILD_CHECK_RUN_ID: ""
          GITHUB_UPLOAD_MODEL_CHECK_RUN_ID: ""
          GITHUB_UPLOAD_DOC_CHECK_RUN_ID: ""
          RELEASE_TAG_NAME: ""
          BUILD_FAILURE_SCENARIO: ""
        run: |
          DELETE_IMAGE_SCRIPT_BASE64="$(base64 -w 0 .github/k8s/tests/image-cleanup-marker.sh)"
          export DELETE_IMAGE_SCRIPT_BASE64
          rendered_job="${RUNNER_TEMP}/ci-k8s-job.yaml"
          .github/k8s/tests/render-test-job.sh > "$rendered_job"
          echo "rendered_job=$rendered_job" >> "$GITHUB_OUTPUT"
          kubectl apply --dry-run=client -f "$rendered_job"
          kubectl apply --dry-run=server -f "$rendered_job"

      - name: Run Kubernetes job
        shell: bash
        run: |
          rendered_job="${{ steps.render.outputs.rendered_job }}"
          job_name="$(kubectl create --dry-run=client -o jsonpath='{.metadata.name}' -f "$rendered_job")"
          kubectl apply -f "$rendered_job"
          kubectl wait \
            --namespace="$KUBE_NAMESPACE" \
            --for=create \
            pod \
            --selector="job-name=${job_name}" \
            --timeout=120s
          kubectl wait \
            --namespace="$KUBE_NAMESPACE" \
            --for=condition=complete \
            "job/${job_name}" \
            --timeout=300s

      - name: Assert image cleanup sidecar was triggered
        shell: bash
        run: |
          rendered_job="${{ steps.render.outputs.rendered_job }}"
          job_name="$(kubectl create --dry-run=client -o jsonpath='{.metadata.name}' -f "$rendered_job")"
          kubectl logs "job/${job_name}" \
            --namespace="$KUBE_NAMESPACE" \
            --container=image-cleanup \
            | grep -F "IMAGE_CLEANUP_TRIGGERED"

      - name: Print Kubernetes diagnostics
        if: always()
        shell: bash
        run: |
          rendered_job="${{ steps.render.outputs.rendered_job }}"
          if [ -n "$rendered_job" ] && [ -f "$rendered_job" ]; then
            job_name="$(kubectl create --dry-run=client -o jsonpath='{.metadata.name}' -f "$rendered_job")"
            kubectl get job "$job_name" --namespace="$KUBE_NAMESPACE" -o wide || true
            kubectl describe job "$job_name" --namespace="$KUBE_NAMESPACE" || true
            kubectl get pods --namespace="$KUBE_NAMESPACE" --selector="job-name=${job_name}" -o wide || true
            for pod in $(kubectl get pods --namespace="$KUBE_NAMESPACE" --selector="job-name=${job_name}" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
              for container in $(kubectl get pod "$pod" --namespace="$KUBE_NAMESPACE" -o jsonpath='{.spec.containers[*].name}' 2>/dev/null); do
                echo "::group::${pod}/${container}"
                kubectl logs "$pod" --namespace="$KUBE_NAMESPACE" --container="$container" || true
                echo "::endgroup::"
              done
            done
          fi

  kubernetes-build-failure-cleanup:
    needs: kubernetes-job-creation

    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      KUBE_NAMESPACE: heavyedge-cd-ci
      KUBE_USERNAME: github-actions
      MLXP_ZONE: ci-k8s
      HEAVYEDGE_TEST_MODE: "1"
      UPLOAD_TO_HUGGINGFACE: "0"
      PUSH_DOC: "0"
      DOCKER_REGISTRY: marker-registry.invalid
      DOCKER_USERNAME: ci
      DOCKER_TAG: placeholder
      TEMP_DOCKER_TAG: placeholder-temp
      CPU_REQUEST: "1"
      GPU_REQUEST: "0"
      GIT_AUTHOR_NAME: heavyedge-bot
      GIT_AUTHOR_EMAIL: heavyedge-bot@users.noreply.github.com
      SMTP_NOTIFY_TO: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: heavyedge-cd-ci-failure
          wait: 120s

      - name: Install render dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext-base

      - name: Prepare Kubernetes namespace
        shell: bash
        run: |
          kubectl create namespace "$KUBE_NAMESPACE"
          kubectl label nodes --all "mlx.navercorp.com/zone=$MLXP_ZONE" --overwrite
          kubectl create secret docker-registry regcred \
            --docker-server=example.invalid \
            --docker-username=placeholder \
            --docker-password=placeholder \
            --namespace="$KUBE_NAMESPACE"
          kubectl create secret generic docker-registry-cleanup \
            --from-literal=DOCKER_USERNAME="$DOCKER_USERNAME" \
            --from-literal=DOCKER_PASSWORD=ci-password \
            --namespace="$KUBE_NAMESPACE"
          kubectl create secret generic gmail-smtp-relay \
            --from-literal=GMAIL_USERNAME=heavyedge-feature-models@localhost \
            --from-literal=GMAIL_APP_PASSWORD=placeholder \
            --namespace="$KUBE_NAMESPACE"

      - name: Run build failure cleanup scenarios
        shell: bash
        env:
          GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_GPU_BUILD_CHECK_RUN_ID: ""
          GITHUB_UPLOAD_MODEL_CHECK_RUN_ID: ""
          GITHUB_UPLOAD_DOC_CHECK_RUN_ID: ""
          RELEASE_TAG_NAME: ""
        run: |
          wait_for_cleanup_trigger() {
            job_name="$1"
            deadline=$((SECONDS + 120))

            while [ "${SECONDS}" -lt "${deadline}" ]; do
              pods="$(kubectl get pods \
                --namespace="$KUBE_NAMESPACE" \
                --selector="job-name=${job_name}" \
                -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || true)"

              for pod in ${pods}; do
                if kubectl logs "$pod" \
                  --namespace="$KUBE_NAMESPACE" \
                  --container=image-cleanup 2>/dev/null \
                  | grep -F "IMAGE_CLEANUP_TRIGGERED"; then
                  return 0
                fi
              done

              sleep 2
            done

            echo "Timed out waiting for image cleanup trigger for ${job_name}." >&2
            return 1
          }

          for scenario in failed-state crash-no-state; do
            export BUILD_FAILURE_SCENARIO="$scenario"
            export JOB_NAME="heavyedge-cd-ci-${scenario}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            export DELETE_IMAGE_SCRIPT_BASE64
            DELETE_IMAGE_SCRIPT_BASE64="$(base64 -w 0 .github/k8s/tests/image-cleanup-marker.sh)"

            rendered_job="${RUNNER_TEMP}/ci-k8s-job-${scenario}.yaml"
            .github/k8s/tests/render-test-job.sh \
              .github/k8s/tests/failure-containers > "$rendered_job"
            kubectl apply --dry-run=client -f "$rendered_job"
            kubectl apply --dry-run=server -f "$rendered_job"
            kubectl apply -f "$rendered_job"
            kubectl wait \
              --namespace="$KUBE_NAMESPACE" \
              --for=create \
              pod \
              --selector="job-name=${JOB_NAME}" \
              --timeout=120s
            wait_for_cleanup_trigger "$JOB_NAME"
          done

      - name: Print Kubernetes diagnostics
        if: always()
        shell: bash
        run: |
          kubectl get jobs --namespace="$KUBE_NAMESPACE" -o wide || true
          kubectl get pods --namespace="$KUBE_NAMESPACE" -o wide || true
          for pod in $(kubectl get pods --namespace="$KUBE_NAMESPACE" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
            kubectl describe pod "$pod" --namespace="$KUBE_NAMESPACE" || true
            for container in $(kubectl get pod "$pod" --namespace="$KUBE_NAMESPACE" -o jsonpath='{.spec.containers[*].name}' 2>/dev/null); do
              echo "::group::${pod}/${container}"
              kubectl logs "$pod" --namespace="$KUBE_NAMESPACE" --container="$container" || true
              echo "::endgroup::"
            done
          done
