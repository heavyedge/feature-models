name: CD Cleanup

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
    inputs:
      gpu_build_check_run_id:
        required: true
        type: string
      cleanup_check_run_id:
        required: true
        type: string
      gpu_build_conclusion:
        required: true
        type: string
      upload_model_check_run_id:
        required: false
        type: string
      upload_model_conclusion:
        required: true
        type: string
      upload_doc_check_run_id:
        required: false
        type: string
      upload_doc_conclusion:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      kubernetes_job_name:
        required: false
        type: string

jobs:

  update-deploy-checks:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          kubeconfig_path="$RUNNER_TEMP/kubeconfig"
          echo "$KUBE_CONFIG" | base64 -d > "$kubeconfig_path"
          chmod 600 "$kubeconfig_path"
          echo "KUBECONFIG=$kubeconfig_path" >> "$GITHUB_ENV"

      - name: Collect Kubernetes Job log
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
          KUBERNETES_JOB_NAME: ${{ inputs.kubernetes_job_name }}
        run: |
          log_file="$RUNNER_TEMP/kubernetes-job.log"
          if [ -z "$KUBERNETES_JOB_NAME" ]; then
            echo "No Kubernetes Job was created for this deployment." > "$log_file"
          elif kubectl logs \
            --namespace="$KUBE_NAMESPACE" \
            "job/$KUBERNETES_JOB_NAME" \
            --container=build \
            --timestamps > "$log_file" 2>&1; then
            :
          else
            status=$?
            printf 'Failed to collect logs from Kubernetes Job %s (exit %s).\n' \
              "$KUBERNETES_JOB_NAME" "$status" >> "$log_file"
          fi

      - name: Create GitHub App token for post-deploy checks
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-checks: write

      - name: Update deploy checks
        uses: actions/github-script@v9
        env:
          GPU_BUILD_CHECK_RUN_ID: ${{ inputs.gpu_build_check_run_id }}
          GPU_BUILD_CONCLUSION: ${{ inputs.gpu_build_conclusion }}
          UPLOAD_MODEL_CHECK_RUN_ID: ${{ inputs.upload_model_check_run_id }}
          UPLOAD_MODEL_CONCLUSION: ${{ inputs.upload_model_conclusion }}
          UPLOAD_DOC_CHECK_RUN_ID: ${{ inputs.upload_doc_check_run_id }}
          UPLOAD_DOC_CONCLUSION: ${{ inputs.upload_doc_conclusion }}
          JOB_LOG_FILE: ${{ runner.temp }}/kubernetes-job.log
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { phaseLog, readCheckLog, truncateLog } = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/check-log.js`
            );
            const secrets = [
              process.env.GH_APP_PRIVATE_KEY,
              process.env.GHCR_TOKEN,
              process.env.GMAIL_APP_PASSWORD,
              process.env.HUGGINGFACE_TOKEN,
              process.env.KUBE_CONFIG,
            ];
            const jobLog = readCheckLog(process.env.JOB_LOG_FILE, secrets);
            const checks = [
              [
                process.env.GPU_BUILD_CHECK_RUN_ID,
                process.env.GPU_BUILD_CONCLUSION,
                'GPU build',
                phaseLog(jobLog, '$ sh .github/k8s/build.sh', '$ sh .github/k8s/app-token.sh'),
              ],
              [
                process.env.UPLOAD_MODEL_CHECK_RUN_ID,
                process.env.UPLOAD_MODEL_CONCLUSION,
                'Upload model',
                phaseLog(jobLog, '$ sh .github/k8s/deploy.sh', '$ sh .github/scripts/deploy-dispatch.sh'),
              ],
              [
                process.env.UPLOAD_DOC_CHECK_RUN_ID,
                process.env.UPLOAD_DOC_CONCLUSION,
                'Upload document',
                phaseLog(jobLog, '$ sh .github/k8s/deploy.sh', '$ sh .github/scripts/deploy-dispatch.sh'),
              ],
            ].filter(([checkRunId]) => checkRunId);
            const allowedConclusions = new Set(['success', 'failure']);

            for (const [checkRunId, conclusion, checkName, checkLog] of checks) {
              const normalizedConclusion = allowedConclusions.has(conclusion)
                ? conclusion
                : 'failure';

              await github.rest.checks.update({
                ...context.repo,
                check_run_id: checkRunId,
                status: 'completed',
                conclusion: normalizedConclusion,
                completed_at: new Date().toISOString(),
                output: {
                  title: checkName,
                  summary: `Kubernetes Job result: ${normalizedConclusion}`,
                  text: truncateLog(checkLog),
                },
              });
            }

  delete-image:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete temporary Docker image
        shell: bash
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          PACKAGE_TOKEN: ${{ secrets.GHCR_TOKEN }}
          PACKAGE_OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: ${{ vars.IMAGE_NAME }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          bash <<'SCRIPT'
          set -euo pipefail

          if [ -z "${GITHUB_API_URL:-}" ] ||
            [ -z "${PACKAGE_TOKEN:-}" ] ||
            [ -z "${PACKAGE_OWNER:-}" ] ||
            [ -z "${PACKAGE_NAME:-}" ] ||
            [ -z "${IMAGE_TAG:-}" ]; then
            echo "GitHub Packages cleanup environment is incomplete; skipping ${IMAGE_TAG:-unknown} deletion." >&2
            exit 0
          fi

          package_versions_url="${GITHUB_API_URL%/}/orgs/${PACKAGE_OWNER}/packages/container/${PACKAGE_NAME}/versions"
          version_id=""
          page=1

          while :; do
            versions="$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${PACKAGE_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --get --data-urlencode "per_page=100" --data-urlencode "page=${page}" \
              "${package_versions_url}")"
            version_id="$(printf '%s' "${versions}" | jq -r --arg image_tag "${IMAGE_TAG}" \
              '([.[] | select(.metadata.container.tags | index($image_tag)) | .id] | .[0]) // empty')"

            if [ -n "${version_id}" ] || [ "$(printf '%s' "${versions}" | jq 'length')" -eq 0 ]; then
              break
            fi

            page=$((page + 1))
          done

          if [ -z "${version_id}" ]; then
            echo "Docker image tag ${PACKAGE_OWNER}/${PACKAGE_NAME}:${IMAGE_TAG} is already absent."
            exit 0
          fi

          delete_status="$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${PACKAGE_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -X DELETE "${package_versions_url}/${version_id}" || true)"

          if [ "${delete_status}" = "204" ] || [ "${delete_status}" = "404" ]; then
            echo "Deleted Docker image tag ${PACKAGE_OWNER}/${PACKAGE_NAME}:${IMAGE_TAG}."
            exit 0
          fi

          echo "Could not delete Docker image tag ${PACKAGE_OWNER}/${PACKAGE_NAME}:${IMAGE_TAG}; GitHub API returned HTTP ${delete_status}." >&2
          exit 1
          SCRIPT

  finalize-cleanup-check:

    name: Finalize CD Cleanup check

    needs:
      - update-deploy-checks
      - delete-image

    if: ${{ always() }}

    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-checks: write

      - name: Complete CD Cleanup check
        uses: actions/github-script@v9
        env:
          CLEANUP_CHECK_RUN_ID: ${{ inputs.cleanup_check_run_id }}
          UPDATE_RESULT: ${{ needs.update-deploy-checks.result }}
          DELETE_RESULT: ${{ needs.delete-image.result }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const conclusion =
              process.env.UPDATE_RESULT === 'success' &&
              process.env.DELETE_RESULT === 'success'
                ? 'success'
                : 'failure';

            await github.rest.checks.update({
              ...context.repo,
              check_run_id: Number(process.env.CLEANUP_CHECK_RUN_ID),
              status: 'completed',
              conclusion,
              completed_at: new Date().toISOString(),
              output: {
                title: 'CD Cleanup',
                summary: `Cleanup result: ${conclusion}`,
              },
            });
