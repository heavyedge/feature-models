name: CD Cleanup

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
    inputs:
      gpu_build_check_run_id:
        required: true
        type: string
      cleanup_check_run_id:
        required: true
        type: string
      gpu_build_conclusion:
        required: true
        type: string
      upload_model_check_run_id:
        required: false
        type: string
      upload_model_conclusion:
        required: true
        type: string
      upload_doc_check_run_id:
        required: false
        type: string
      upload_doc_conclusion:
        required: true
        type: string
      image_tag:
        required: true
        type: string

jobs:

  update-deploy-checks:

    runs-on: ubuntu-latest

    steps:

      - name: Create GitHub App token for post-deploy checks
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-checks: write

      - name: Update deploy checks
        uses: actions/github-script@v9
        env:
          GPU_BUILD_CHECK_RUN_ID: ${{ inputs.gpu_build_check_run_id }}
          GPU_BUILD_CONCLUSION: ${{ inputs.gpu_build_conclusion }}
          UPLOAD_MODEL_CHECK_RUN_ID: ${{ inputs.upload_model_check_run_id }}
          UPLOAD_MODEL_CONCLUSION: ${{ inputs.upload_model_conclusion }}
          UPLOAD_DOC_CHECK_RUN_ID: ${{ inputs.upload_doc_check_run_id }}
          UPLOAD_DOC_CONCLUSION: ${{ inputs.upload_doc_conclusion }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const checks = [
              [process.env.GPU_BUILD_CHECK_RUN_ID, process.env.GPU_BUILD_CONCLUSION],
              [process.env.UPLOAD_MODEL_CHECK_RUN_ID, process.env.UPLOAD_MODEL_CONCLUSION],
              [process.env.UPLOAD_DOC_CHECK_RUN_ID, process.env.UPLOAD_DOC_CONCLUSION],
            ].filter(([checkRunId]) => checkRunId);
            const allowedConclusions = new Set(['success', 'failure']);

            for (const [checkRunId, conclusion] of checks) {
              const normalizedConclusion = allowedConclusions.has(conclusion)
                ? conclusion
                : 'failure';

              await github.rest.checks.update({
                ...context.repo,
                check_run_id: checkRunId,
                status: 'completed',
                conclusion: normalizedConclusion,
                completed_at: new Date().toISOString(),
              });
            }

  delete-image:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Delete temporary Docker image
        shell: bash
        env:
          DOCKER_REGISTRY: ghcr.io
          DOCKER_USERNAME: ${{ github.actor }}
          DOCKER_PASSWORD: ${{ github.token }}
          DOCKER_NAMESPACE: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          sh .github/scripts/delete-image.sh

  finalize-cleanup-check:

    name: Finalize CD Cleanup check

    needs:
      - update-deploy-checks
      - delete-image

    if: ${{ always() }}

    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-checks: write

      - name: Complete CD Cleanup check
        uses: actions/github-script@v9
        env:
          CLEANUP_CHECK_RUN_ID: ${{ inputs.cleanup_check_run_id }}
          UPDATE_RESULT: ${{ needs.update-deploy-checks.result }}
          DELETE_RESULT: ${{ needs.delete-image.result }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const conclusion =
              process.env.UPDATE_RESULT === 'success' &&
              process.env.DELETE_RESULT === 'success'
                ? 'success'
                : 'failure';

            await github.rest.checks.update({
              ...context.repo,
              check_run_id: Number(process.env.CLEANUP_CHECK_RUN_ID),
              status: 'completed',
              conclusion,
              completed_at: new Date().toISOString(),
              output: {
                title: 'CD Cleanup',
                summary: `Cleanup result: ${conclusion}`,
              },
            });
