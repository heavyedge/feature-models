name: CD Cleanup

on:
  repository_dispatch:
    types:
      - post-deploy

jobs:

  update-deploy-checks:

    runs-on: ubuntu-latest

    steps:

      - name: Create GitHub App token for post-deploy checks
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-checks: write

      - name: Update deploy checks
        uses: actions/github-script@v9
        env:
          GPU_BUILD_CHECK_RUN_ID: ${{ github.event.client_payload.gpu_build_check_run_id }}
          GPU_BUILD_CONCLUSION: ${{ github.event.client_payload.gpu_build_conclusion }}
          UPLOAD_MODEL_CHECK_RUN_ID: ${{ github.event.client_payload.upload_model_check_run_id }}
          UPLOAD_MODEL_CONCLUSION: ${{ github.event.client_payload.upload_model_conclusion }}
          UPLOAD_DOC_CHECK_RUN_ID: ${{ github.event.client_payload.upload_doc_check_run_id }}
          UPLOAD_DOC_CONCLUSION: ${{ github.event.client_payload.upload_doc_conclusion }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const checks = [
              [process.env.GPU_BUILD_CHECK_RUN_ID, process.env.GPU_BUILD_CONCLUSION],
              [process.env.UPLOAD_MODEL_CHECK_RUN_ID, process.env.UPLOAD_MODEL_CONCLUSION],
              [process.env.UPLOAD_DOC_CHECK_RUN_ID, process.env.UPLOAD_DOC_CONCLUSION],
            ].filter(([checkRunId]) => checkRunId);
            const allowedConclusions = new Set(['success', 'failure']);

            for (const [checkRunId, conclusion] of checks) {
              const normalizedConclusion = allowedConclusions.has(conclusion)
                ? conclusion
                : 'failure';

              await github.rest.checks.update({
                ...context.repo,
                check_run_id: checkRunId,
                status: 'completed',
                conclusion: normalizedConclusion,
                completed_at: new Date().toISOString(),
              });
            }

  delete-image:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker registry
        shell: bash
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          for attempt in 1 2; do
            if printf '%s' "$DOCKER_PASSWORD" | docker login "$DOCKER_REGISTRY" --username "$DOCKER_USERNAME" --password-stdin; then
              exit 0
            fi

            if [ "$attempt" -lt 2 ]; then
              echo "Docker login failed. Retrying in 3 seconds..."
              sleep 3
            fi
          done

          echo "Docker login failed after 2 attempts."
          exit 1

      - name: Delete temporary Docker image
        shell: bash
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_NAMESPACE: ${{ secrets.DOCKER_NAMESPACE }}
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
          IMAGE_TAG: ${{ github.event.client_payload.image_tag }}
        run: |
          sh .github/scripts/delete-image.sh

  finalize-cleanup-check:

    needs:
      - update-deploy-checks
      - delete-image

    if: ${{ always() }}

    runs-on: ubuntu-latest

    steps:

      - name: Create GitHub App token for cleanup check
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-checks: write

      - name: Update cleanup check
        uses: actions/github-script@v9
        env:
          CD_CLEANUP_CHECK_RUN_ID: ${{ github.event.client_payload.cd_cleanup_check_run_id }}
          UPDATE_CHECKS_RESULT: ${{ needs.update-deploy-checks.result }}
          DELETE_IMAGE_RESULT: ${{ needs.delete-image.result }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const checkRunId = process.env.CD_CLEANUP_CHECK_RUN_ID;
            if (!checkRunId) {
              core.warning('Missing CD cleanup check run ID; skipping check update.');
              return;
            }

            const succeeded =
              process.env.UPDATE_CHECKS_RESULT === 'success' &&
              process.env.DELETE_IMAGE_RESULT === 'success';

            await github.rest.checks.update({
              ...context.repo,
              check_run_id: checkRunId,
              status: 'completed',
              conclusion: succeeded ? 'success' : 'failure',
              completed_at: new Date().toISOString(),
              output: {
                title: 'CD Cleanup',
                summary: succeeded
                  ? 'Post-deploy cleanup completed.'
                  : 'Post-deploy cleanup failed.',
              },
            });
