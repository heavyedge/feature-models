name: CD Cleanup

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
    inputs:
      gpu_build_check_run_id:
        required: true
        type: string
      cleanup_check_run_id:
        required: true
        type: string
      gpu_build_conclusion:
        required: true
        type: string
      upload_model_check_run_id:
        required: false
        type: string
      upload_model_conclusion:
        required: true
        type: string
      upload_doc_check_run_id:
        required: false
        type: string
      upload_doc_conclusion:
        required: true
        type: string
      image_tag:
        required: true
        type: string

jobs:

  update-deploy-checks:

    runs-on: ubuntu-latest

    steps:

      - name: Create GitHub App token for post-deploy checks
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-checks: write

      - name: Update deploy checks
        uses: actions/github-script@v9
        env:
          GPU_BUILD_CHECK_RUN_ID: ${{ inputs.gpu_build_check_run_id }}
          GPU_BUILD_CONCLUSION: ${{ inputs.gpu_build_conclusion }}
          UPLOAD_MODEL_CHECK_RUN_ID: ${{ inputs.upload_model_check_run_id }}
          UPLOAD_MODEL_CONCLUSION: ${{ inputs.upload_model_conclusion }}
          UPLOAD_DOC_CHECK_RUN_ID: ${{ inputs.upload_doc_check_run_id }}
          UPLOAD_DOC_CONCLUSION: ${{ inputs.upload_doc_conclusion }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const checks = [
              [process.env.GPU_BUILD_CHECK_RUN_ID, process.env.GPU_BUILD_CONCLUSION],
              [process.env.UPLOAD_MODEL_CHECK_RUN_ID, process.env.UPLOAD_MODEL_CONCLUSION],
              [process.env.UPLOAD_DOC_CHECK_RUN_ID, process.env.UPLOAD_DOC_CONCLUSION],
            ].filter(([checkRunId]) => checkRunId);
            const allowedConclusions = new Set(['success', 'failure']);

            for (const [checkRunId, conclusion] of checks) {
              const normalizedConclusion = allowedConclusions.has(conclusion)
                ? conclusion
                : 'failure';

              await github.rest.checks.update({
                ...context.repo,
                check_run_id: checkRunId,
                status: 'completed',
                conclusion: normalizedConclusion,
                completed_at: new Date().toISOString(),
              });
            }

  delete-image:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Delete temporary Docker image
        shell: bash
        env:
          DOCKER_REGISTRY: ghcr.io
          DOCKER_USERNAME: ${{ secrets.GHCR_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.GHCR_TOKEN }}
          DOCKER_NAMESPACE: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          bash <<'SCRIPT'
          set -euo pipefail

          if [ -z "${DOCKER_REGISTRY:-}" ] ||
            [ -z "${DOCKER_NAMESPACE:-}" ] ||
            [ -z "${IMAGE_NAME:-}" ] ||
            [ -z "${IMAGE_TAG:-}" ]; then
            echo "Docker registry cleanup environment is incomplete; skipping ${IMAGE_TAG:-unknown} deletion." >&2
            exit 0
          fi

          if [ -z "${DOCKER_USERNAME:-}" ] || [ -z "${DOCKER_PASSWORD:-}" ]; then
            echo "Docker registry cleanup credentials are incomplete; skipping ${IMAGE_TAG} deletion." >&2
            exit 0
          fi

          docker_repository="${DOCKER_NAMESPACE}/${IMAGE_NAME}"

          case "${DOCKER_REGISTRY}" in
            http://* | https://*) registry_url="${DOCKER_REGISTRY%/}" ;;
            *) registry_url="https://${DOCKER_REGISTRY%/}" ;;
          esac

          manifest_url="${registry_url}/v2/${docker_repository}/manifests/${IMAGE_TAG}"
          headers_file="$(mktemp)"
          trap 'rm -f "${headers_file}"' EXIT
          accept_header="application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json"

          auth_status="$(curl -sS -o /dev/null -w "%{http_code}" -D "${headers_file}" \
            -H "Accept: ${accept_header}" --head "${manifest_url}" || true)"

          if [ "${auth_status}" = "404" ]; then
            echo "Docker image tag ${docker_repository}:${IMAGE_TAG} is already absent."
            exit 0
          fi

          www_authenticate="$(awk 'BEGIN { IGNORECASE = 1 } /^www-authenticate:/ { sub(/^[^:]*:[[:space:]]*/, ""); print; exit }' "${headers_file}" | tr -d '\r')"
          token_realm="$(printf '%s\n' "${www_authenticate}" | sed -n 's/.*realm="\([^"]*\)".*/\1/p')"
          token_service="$(printf '%s\n' "${www_authenticate}" | sed -n 's/.*service="\([^"]*\)".*/\1/p')"

          if [ -z "${token_realm}" ] || [ -z "${token_service}" ]; then
            echo "Could not obtain a registry authentication challenge for ${docker_repository}:${IMAGE_TAG}; registry returned HTTP ${auth_status}." >&2
            exit 1
          fi

          token_response="$(curl -fsS --user "${DOCKER_USERNAME}:${DOCKER_PASSWORD}" \
            --get --data-urlencode "service=${token_service}" \
            --data-urlencode "scope=repository:${docker_repository}:pull,delete" \
            "${token_realm}")"
          registry_token="$(printf '%s' "${token_response}" | jq -r '.token // .access_token // empty')"

          if [ -z "${registry_token}" ]; then
            echo "Registry token service did not return an access token for ${docker_repository}." >&2
            exit 1
          fi

          http_status="$(curl -sS -o /dev/null -w "%{http_code}" -D "${headers_file}" \
            -H "Accept: ${accept_header}" \
            -H "Authorization: Bearer ${registry_token}" --head "${manifest_url}" || true)"

          if [ "${http_status}" = "404" ]; then
            echo "Docker image tag ${docker_repository}:${IMAGE_TAG} is already absent."
            exit 0
          fi

          if [ "${http_status}" -lt 200 ] || [ "${http_status}" -ge 300 ]; then
            echo "Could not inspect Docker image tag ${docker_repository}:${IMAGE_TAG}; registry returned HTTP ${http_status}." >&2
            exit 1
          fi

          digest="$(awk 'tolower($0) ~ /^docker-content-digest:/ { print $2; exit }' "${headers_file}" | tr -d '\r')"
          if [ -z "${digest}" ]; then
            echo "Registry did not return Docker-Content-Digest for ${docker_repository}:${IMAGE_TAG}." >&2
            exit 1
          fi

          delete_status="$(
            curl -sS -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${registry_token}" \
              -X DELETE "${registry_url}/v2/${docker_repository}/manifests/${digest}" || true
          )"

          if [ "${delete_status}" = "404" ] || [ "${delete_status}" = "202" ]; then
            echo "Deleted Docker image tag ${docker_repository}:${IMAGE_TAG}."
            exit 0
          fi

          echo "Could not delete Docker image tag ${docker_repository}:${IMAGE_TAG}; registry returned HTTP ${delete_status}." >&2
          exit 1
          SCRIPT

  finalize-cleanup-check:

    name: Finalize CD Cleanup check

    needs:
      - update-deploy-checks
      - delete-image

    if: ${{ always() }}

    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-checks: write

      - name: Complete CD Cleanup check
        uses: actions/github-script@v9
        env:
          CLEANUP_CHECK_RUN_ID: ${{ inputs.cleanup_check_run_id }}
          UPDATE_RESULT: ${{ needs.update-deploy-checks.result }}
          DELETE_RESULT: ${{ needs.delete-image.result }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const conclusion =
              process.env.UPDATE_RESULT === 'success' &&
              process.env.DELETE_RESULT === 'success'
                ? 'success'
                : 'failure';

            await github.rest.checks.update({
              ...context.repo,
              check_run_id: Number(process.env.CLEANUP_CHECK_RUN_ID),
              status: 'completed',
              conclusion,
              completed_at: new Date().toISOString(),
              output: {
                title: 'CD Cleanup',
                summary: `Cleanup result: ${conclusion}`,
              },
            });
