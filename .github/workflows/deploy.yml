name: Deploy to Kubernetes

on:
  workflow_call:
    inputs:
      publish_doc_check_run_id:
        description: Check run to pass to the release documentation build.
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Create GitHub App token for checks
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-checks: write
