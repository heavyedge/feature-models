name: Pages

on:
  push:
    branches:
      - gh-pages

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Pages site
        uses: actions/checkout@v4

      - name: Prepare Pages artifact
        run: |
          mkdir -p "${{ runner.temp }}/pages-artifact"
          cp -a . "${{ runner.temp }}/pages-artifact/"
          rm -rf "${{ runner.temp }}/pages-artifact/.git"
          rm -rf "${{ runner.temp }}/pages-artifact/.github"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages-artifact

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
