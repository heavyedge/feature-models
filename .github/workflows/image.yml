name: Push Image

on:
  workflow_dispatch:
    inputs:
      model_uploaded:
        required: true
        type: string
      model_revision:
        required: true
        type: string
      repo_id:
        required: true
        type: string

jobs:

  publish-image:

    if: inputs.model_uploaded == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download trained model
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          hf auth login --token $HUGGINGFACE_TOKEN
          hf download "${REPO_ID}" --repo-type model --revision "${MODEL_REVISION}" --local-dir model
        env:
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          MODEL_REVISION: ${{ inputs.model_revision }}
          REPO_ID: ${{ inputs.repo_id }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker registry
        shell: bash
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          for attempt in 1 2; do
            if printf '%s' "$DOCKER_PASSWORD" | docker login "$DOCKER_REGISTRY" --username "$DOCKER_USERNAME" --password-stdin; then
              exit 0
            fi

            if [ "$attempt" -lt 2 ]; then
              echo "Docker login failed. Retrying in 3 seconds..."
              sleep 3
            fi
          done

          echo "Docker login failed after 2 attempts."
          exit 1

      - name: Set Docker image metadata
        id: image-metadata
        shell: bash
        env:
          MODEL_VERSION: ${{ inputs.model_revision }}
        run: |
          echo "tag=${MODEL_VERSION}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"

      - name: Build and push temporary Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=feature-models
          cache-to: type=gha,mode=max,scope=feature-models
          build-args: |
            IMAGE_CREATED=${{ steps.image-metadata.outputs.created }}
            IMAGE_VERSION=${{ inputs.model_revision }}
            IMAGE_REVISION=${{ github.sha }}
          secrets: |
            hf_token=${{ secrets.HUGGINGFACE_TOKEN }}
          tags: ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_NAMESPACE }}/${{ vars.IMAGE_NAME }}:${{ steps.image-metadata.outputs.tag }}
