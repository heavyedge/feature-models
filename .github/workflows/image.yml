name: Push Image

on:
  workflow_dispatch:
    inputs:
      artifact_name:
        description: Name of the Sphinx HTML artifact to download.
        required: true
        type: string
      artifact_run_id:
        description: Documentation workflow run ID that produced the artifact.
        required: true
        type: string
      push_image:
        description: Whether to push the published image.
        required: true
        type: string
      image_version:
        description: Repository release version used to tag the base image.
        required: true
        type: string
      trained_model_released:
        description: Whether this release published a new trained model.
        required: true
        type: string
      model_revision:
        description: Revision of the trained model to include in the image.
        required: true
        type: string
      repo_id:
        description: Hugging Face repository containing the trained model.
        required: true
        type: string

jobs:
  publish-base:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download trained model
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          hf auth login --token $HUGGINGFACE_TOKEN
          hf download "${REPO_ID}" --repo-type model --revision "${MODEL_REVISION}" --local-dir model
        env:
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          MODEL_REVISION: ${{ inputs.model_revision }}
          REPO_ID: ${{ inputs.repo_id }}

      - name: Create GitHub App token for artifact download
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-actions: read

      - name: Download Sphinx HTML artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: doc/build/html
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set Docker image metadata
        id: image-metadata
        shell: bash
        env:
          IMAGE_VERSION: ${{ inputs.image_version }}
        run: |
          echo "tag=${IMAGE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"

      - name: Build (and push) basic image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ inputs.push_image == '1' }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=feature-models-base
          cache-to: type=gha,mode=max,scope=feature-models-base
          target: base
          build-args: |
            IMAGE_CREATED=${{ steps.image-metadata.outputs.created }}
            IMAGE_VERSION=${{ inputs.image_version }}
            IMAGE_REVISION=${{ github.event.pull_request.head.sha || github.sha }}
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_NAMESPACE }}/${{ vars.IMAGE_NAME }}:${{ steps.image-metadata.outputs.tag }}
            ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_NAMESPACE }}/${{ vars.IMAGE_NAME }}:latest

  publish-infer:
    if: ${{ inputs.trained_model_released == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download trained model
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          hf auth login --token $HUGGINGFACE_TOKEN
          hf download "${REPO_ID}" --repo-type model --revision "${MODEL_REVISION}" --local-dir model
        env:
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          MODEL_REVISION: ${{ inputs.model_revision }}
          REPO_ID: ${{ inputs.repo_id }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set Docker image metadata
        id: image-metadata
        shell: bash
        env:
          IMAGE_VERSION: ${{ inputs.image_version }}
        run: |
          echo "tag=${IMAGE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"

      - name: Build (and push) inference image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ inputs.push_image == '1' }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=feature-models-infer
          cache-to: type=gha,mode=max,scope=feature-models-infer
          target: infer
          build-args: |
            IMAGE_CREATED=${{ steps.image-metadata.outputs.created }}
            IMAGE_VERSION=${{ inputs.image_version }}
            IMAGE_REVISION=${{ github.event.pull_request.head.sha || github.sha }}
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_NAMESPACE }}/${{ vars.IMAGE_NAME }}:${{ steps.image-metadata.outputs.tag }}-infer
            ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_NAMESPACE }}/${{ vars.IMAGE_NAME }}:latest-infer
