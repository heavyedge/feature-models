apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: ${KUBE_NAMESPACE}
  annotations:
    creator: "${KUBE_USERNAME}"
spec:
  ttlSecondsAfterFinished: 600
  activeDeadlineSeconds: 21600
  backoffLimit: 1
  template:
    metadata:
      labels:
        git-sha: ${GIT_SHA}
        github-event: ${EVENT_NAME}
      annotations:
        sidecar.istio.io/inject: "false"
        creator: "${KUBE_USERNAME}"
    spec:
      nodeSelector:
          mlx.navercorp.com/zone: ${MLXP_ZONE}
      restartPolicy: Never
      imagePullSecrets:
        - name: regcred
      volumes:
        - name: postfix-state
          emptyDir: {}
        - name: gmail-smtp-relay
          secret:
            secretName: gmail-smtp-relay
      containers:
        - name: heavyedge-feature-models
          image: ${DOCKER_REGISTRY}/${DOCKER_USERNAME}/heavyedge/feature-models:${DOCKER_TAG}
          imagePullPolicy: Always
          resources:
            requests:
              memory: "4Gi"
              cpu: "${CPU_REQUEST}"
              nvidia.com/gpu: "${GPU_REQUEST}"
            limits:
              memory: "16Gi"
              cpu: "${CPU_REQUEST}"
              nvidia.com/gpu: "${GPU_REQUEST}"
          command: ["sh", ".github/scripts/deploy.sh"]
          volumeMounts:
            - name: postfix-state
              mountPath: /var/run/heavyedge
          env:
            - name: JOB_NAME
              value: "${JOB_NAME}"
            - name: GIT_SHA
              value: "${GIT_SHA}"
            - name: GITHUB_REPOSITORY
              value: "${GITHUB_REPOSITORY}"
            - name: GITHUB_RUN_URL
              value: "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            - name: TAG_NAME
              value: "${RELEASE_TAG_NAME}"
            - name: EVENT_NAME
              value: "${EVENT_NAME}"
            - name: HEAVYEDGE_TEST_MODE
              value: "${HEAVYEDGE_TEST_MODE}"
            - name: UPLOAD_TO_HUGGINGFACE
              value: "${UPLOAD_TO_HUGGINGFACE}"
            - name: PUSH_DOC
              value: "${PUSH_DOC}"
            - name: GIT_AUTHOR_NAME
              value: "${GIT_AUTHOR_NAME}"
            - name: GIT_AUTHOR_EMAIL
              value: "${GIT_AUTHOR_EMAIL}"
            - name: DOCKER_REGISTRY
              value: "${DOCKER_REGISTRY}"
            - name: DOCKER_REPOSITORY
              value: "${DOCKER_USERNAME}/heavyedge/feature-models"
            - name: DOCKER_TAG
              value: "${DOCKER_TAG}"
            - name: DELETE_TEMP_DOCKER_TAG
              value: "${DELETE_TEMP_DOCKER_TAG}"
            - name: HUGGINGFACE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: huggingface-token
                  key: HUGGINGFACE_TOKEN
                  optional: true
            - name: DOCKER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: docker-registry-cleanup
                  key: DOCKER_USERNAME
                  optional: true
            - name: DOCKER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: docker-registry-cleanup
                  key: DOCKER_PASSWORD
                  optional: true
        - name: email-notify
          image: curlimages/curl:8.21.0
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
          securityContext:
            runAsUser: 0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              set -f

              state_dir="${HEAVYEDGE_STATE_DIR:-/var/run/heavyedge}"
              result_file="${DEPLOY_RESULT_FILE:-${state_dir}/deploy-result}"
              notify_done_file="${NOTIFY_DEPLOY_DONE_FILE:-${state_dir}/notify-deploy-complete}"

              finish_notify() {
                mkdir -p "$(dirname "${notify_done_file}")"
                touch "${notify_done_file}"
              }

              trap finish_notify EXIT

              build_message() {
                printf 'From: %s\r\n' "${mail_from}"
                printf 'To: %s\r\n' "${SMTP_NOTIFY_TO}"
                printf 'Subject: [%s] %s\r\n' "${subject_status}" "${JOB_NAME:-heavyedge-feature-models}"
                printf 'Content-Type: text/plain; charset=UTF-8\r\n'
                printf 'Content-Transfer-Encoding: 8bit\r\n'
                printf '\r\n'
                printf 'heavyedge-feature-models %s.\r\n' "${subject_status}"
                printf '\r\n'
                printf 'Job: %s\r\n' "${JOB_NAME:-heavyedge-feature-models}"
                printf 'Repository: %s\r\n' "${GITHUB_REPOSITORY:-unknown repository}"
                printf 'Git SHA: %s\r\n' "${GIT_SHA:-unknown}"
                printf 'Event: %s\r\n' "${EVENT_NAME:-unknown}"
                if [ -n "${TAG_NAME:-}" ]; then
                  printf 'Tag: %s\r\n' "${TAG_NAME}"
                fi
                if [ -n "${GITHUB_RUN_URL:-}" ]; then
                  printf 'GitHub Actions run: %s\r\n' "${GITHUB_RUN_URL}"
                fi
                printf '\r\n'
                printf 'HEAVYEDGE_TEST_MODE=%s\r\n' "${HEAVYEDGE_TEST_MODE:-}"
                printf 'UPLOAD_TO_HUGGINGFACE=%s\r\n' "${UPLOAD_TO_HUGGINGFACE:-}"
                printf 'PUSH_DOC=%s\r\n' "${PUSH_DOC:-}"
              }

              send_mail() {
                subject_status="$1"

                if [ -z "${SMTP_NOTIFY_TO:-}" ]; then
                  echo "SMTP_NOTIFY_TO is empty; skipping ${subject_status} notification."
                  return 0
                fi

                mail_from="${SMTP_MAIL_FROM:-heavyedge-feature-models@localhost}"
                smtp_host="${SMTP_HOST:-127.0.0.1}"
                smtp_port="${SMTP_PORT:-587}"
                retries="${SMTP_NOTIFY_RETRIES:-12}"
                delay="${SMTP_NOTIFY_RETRY_DELAY:-5}"

                set -- \
                  --fail \
                  --show-error \
                  --silent \
                  --connect-timeout 10 \
                  --max-time 30 \
                  --url "smtp://${smtp_host}:${smtp_port}" \
                  --mail-from "${mail_from}" \
                  --upload-file -

                rcpt_count=0
                old_ifs="${IFS}"
                IFS=', '
                for recipient in ${SMTP_NOTIFY_TO}; do
                  if [ -n "${recipient}" ]; then
                    set -- "$@" --mail-rcpt "${recipient}"
                    rcpt_count=$((rcpt_count + 1))
                  fi
                done
                IFS="${old_ifs}"

                if [ "${rcpt_count}" -eq 0 ]; then
                  echo "SMTP_NOTIFY_TO has no recipients; skipping ${subject_status} notification."
                  return 0
                fi

                attempt=1
                while [ "${attempt}" -le "${retries}" ]; do
                  if build_message | curl "$@"; then
                    echo "Sent ${subject_status} notification to ${SMTP_NOTIFY_TO}."
                    return 0
                  fi

                  echo "Notification attempt ${attempt}/${retries} failed." >&2
                  if [ "${attempt}" -lt "${retries}" ]; then
                    sleep "${delay}"
                  fi
                  attempt=$((attempt + 1))
                done

                echo "Failed to send ${subject_status} notification." >&2
                return 1
              }

              send_mail started || true

              while [ ! -f "${result_file}" ]; do
                sleep 5
              done

              . "${result_file}"

              case "${status:-}" in
                succeeded|failed)
                  send_mail "${status}" || true
                  ;;
                *)
                  echo "Unknown deploy result status '${status:-}'; sending failure notification." >&2
                  send_mail failed || true
                  ;;
              esac
          volumeMounts:
            - name: postfix-state
              mountPath: /var/run/heavyedge
          env:
            - name: JOB_NAME
              value: "${JOB_NAME}"
            - name: GIT_SHA
              value: "${GIT_SHA}"
            - name: GITHUB_REPOSITORY
              value: "${GITHUB_REPOSITORY}"
            - name: GITHUB_RUN_URL
              value: "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            - name: TAG_NAME
              value: "${RELEASE_TAG_NAME}"
            - name: EVENT_NAME
              value: "${EVENT_NAME}"
            - name: HEAVYEDGE_TEST_MODE
              value: "${HEAVYEDGE_TEST_MODE}"
            - name: UPLOAD_TO_HUGGINGFACE
              value: "${UPLOAD_TO_HUGGINGFACE}"
            - name: PUSH_DOC
              value: "${PUSH_DOC}"
            - name: SMTP_HOST
              value: "127.0.0.1"
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_NOTIFY_TO
              value: "${SMTP_NOTIFY_TO}"
            - name: SMTP_MAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: gmail-smtp-relay
                  key: GMAIL_USERNAME
        - name: github-check-run
          image: ${DOCKER_REGISTRY}/${DOCKER_USERNAME}/heavyedge/feature-models:${DOCKER_TAG}
          imagePullPolicy: Always
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
          command: ["sh", ".github/scripts/github-check-run-sidecar.sh"]
          volumeMounts:
            - name: postfix-state
              mountPath: /var/run/heavyedge
          env:
            - name: JOB_NAME
              value: "${JOB_NAME}"
            - name: GIT_SHA
              value: "${GIT_SHA}"
            - name: GITHUB_REPOSITORY
              value: "${GITHUB_REPOSITORY}"
            - name: GITHUB_RUN_URL
              value: "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            - name: GITHUB_CHECK_RUN_ID
              value: "${GITHUB_CHECK_RUN_ID}"
            - name: GH_APP_ID
              valueFrom:
                secretKeyRef:
                  name: github-app
                  key: GH_APP_ID
                  optional: true
            - name: GH_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: github-app
                  key: GH_APP_PRIVATE_KEY
                  optional: true
            - name: GH_APP_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: github-app
                  key: GH_APP_INSTALLATION_ID
                  optional: true
        - name: postfix
          image: boky/postfix:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
          ports:
            - name: smtp
              containerPort: 587
          command: ["/bin/sh", "-c"]
          args:
            - |
              /scripts/run.sh &
              postfix_pid=$!
              while [ ! -f /var/run/heavyedge/notify-deploy-complete ]; do
                if ! kill -0 "${postfix_pid}" 2>/dev/null; then
                  wait "${postfix_pid}"
                  exit $?
                fi
                sleep 5
              done
              postfix stop || true
              kill "${postfix_pid}" 2>/dev/null || true
              wait "${postfix_pid}" 2>/dev/null || true
          env:
            - name: RELAYHOST
              value: "[smtp.gmail.com]:587"
            - name: RELAYHOST_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gmail-smtp-relay
                  key: GMAIL_USERNAME
            - name: RELAYHOST_PASSWORD_FILE
              value: "/run/secrets/gmail/GMAIL_APP_PASSWORD"
            - name: POSTFIX_smtp_tls_security_level
              value: "encrypt"
            - name: POSTFIX_mynetworks
              value: "127.0.0.0/8 [::1]/128"
            - name: ALLOW_EMPTY_SENDER_DOMAINS
              value: "true"
            - name: LOG_FORMAT
              value: "json"
          volumeMounts:
            - name: postfix-state
              mountPath: /var/run/heavyedge
            - name: gmail-smtp-relay
              mountPath: /run/secrets/gmail
              readOnly: true
