apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: ${KUBE_NAMESPACE}
  annotations:
    creator: "${KUBE_USERNAME}"
spec:
  ttlSecondsAfterFinished: 600
  activeDeadlineSeconds: 21600
  backoffLimit: 1
  template:
    metadata:
      labels:
        git-sha: ${GIT_SHA}
        github-event: ${EVENT_NAME}
      annotations:
        sidecar.istio.io/inject: "false"
        creator: "${KUBE_USERNAME}"
    spec:
      nodeSelector:
          mlx.navercorp.com/zone: ${MLXP_ZONE}
      restartPolicy: Never
      imagePullSecrets:
        - name: regcred
      volumes:
        - name: postfix-state
          emptyDir: {}
        - name: gmail-smtp-relay
          secret:
            secretName: gmail-smtp-relay
      containers:
        - name: heavyedge-feature-models
          image: ${DOCKER_REGISTRY}/${DOCKER_USERNAME}/heavyedge/feature-models:${DOCKER_TAG}
          imagePullPolicy: Always
          resources:
            requests:
              memory: "4Gi"
              cpu: "${CPU_REQUEST}"
              nvidia.com/gpu: "${GPU_REQUEST}"
            limits:
              memory: "16Gi"
              cpu: "${CPU_REQUEST}"
              nvidia.com/gpu: "${GPU_REQUEST}"
          command: ["sh", ".github/scripts/deploy.sh"]
          volumeMounts:
            - name: postfix-state
              mountPath: /var/run/heavyedge
          env:
            - name: JOB_NAME
              value: "${JOB_NAME}"
            - name: GIT_SHA
              value: "${GIT_SHA}"
            - name: GITHUB_REPOSITORY
              value: "${GITHUB_REPOSITORY}"
            - name: GITHUB_RUN_URL
              value: "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            - name: TAG_NAME
              value: "${RELEASE_TAG_NAME}"
            - name: EVENT_NAME
              value: "${EVENT_NAME}"
            - name: HEAVYEDGE_TEST_MODE
              value: "${HEAVYEDGE_TEST_MODE}"
            - name: UPLOAD_TO_HUGGINGFACE
              value: "${UPLOAD_TO_HUGGINGFACE}"
            - name: PUSH_DOC
              value: "${PUSH_DOC}"
            - name: GIT_AUTHOR_NAME
              value: "${GIT_AUTHOR_NAME}"
            - name: GIT_AUTHOR_EMAIL
              value: "${GIT_AUTHOR_EMAIL}"
            - name: DOCKER_REGISTRY
              value: "${DOCKER_REGISTRY}"
            - name: DOCKER_REPOSITORY
              value: "${DOCKER_USERNAME}/heavyedge/feature-models"
            - name: DOCKER_TAG
              value: "${DOCKER_TAG}"
            - name: DELETE_TEMP_DOCKER_TAG
              value: "${DELETE_TEMP_DOCKER_TAG}"
            - name: HUGGINGFACE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: huggingface-token
                  key: HUGGINGFACE_TOKEN
                  optional: true
            - name: DOCKER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: docker-registry-cleanup
                  key: DOCKER_USERNAME
                  optional: true
            - name: DOCKER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: docker-registry-cleanup
                  key: DOCKER_PASSWORD
                  optional: true
        - name: email-notify
          image: curlimages/curl:8.21.0
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
          securityContext:
            runAsUser: 0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              set -f

              state_dir="${HEAVYEDGE_STATE_DIR:-/var/run/heavyedge}"
              result_file="${DEPLOY_RESULT_FILE:-${state_dir}/deploy-result}"
              notify_done_file="${NOTIFY_DEPLOY_DONE_FILE:-${state_dir}/notify-deploy-complete}"

              finish_notify() {
                mkdir -p "$(dirname "${notify_done_file}")"
                touch "${notify_done_file}"
              }

              trap finish_notify EXIT

              build_message() {
                printf 'From: %s\r\n' "${mail_from}"
                printf 'To: %s\r\n' "${SMTP_NOTIFY_TO}"
                printf 'Subject: [%s] %s\r\n' "${subject_status}" "${JOB_NAME:-heavyedge-feature-models}"
                printf 'Content-Type: text/plain; charset=UTF-8\r\n'
                printf 'Content-Transfer-Encoding: 8bit\r\n'
                printf '\r\n'
                printf 'heavyedge-feature-models %s.\r\n' "${subject_status}"
                printf '\r\n'
                printf 'Job: %s\r\n' "${JOB_NAME:-heavyedge-feature-models}"
                printf 'Repository: %s\r\n' "${GITHUB_REPOSITORY:-unknown repository}"
                printf 'Git SHA: %s\r\n' "${GIT_SHA:-unknown}"
                printf 'Event: %s\r\n' "${EVENT_NAME:-unknown}"
                if [ -n "${TAG_NAME:-}" ]; then
                  printf 'Tag: %s\r\n' "${TAG_NAME}"
                fi
                if [ -n "${GITHUB_RUN_URL:-}" ]; then
                  printf 'GitHub Actions run: %s\r\n' "${GITHUB_RUN_URL}"
                fi
                printf '\r\n'
                printf 'HEAVYEDGE_TEST_MODE=%s\r\n' "${HEAVYEDGE_TEST_MODE:-}"
                printf 'UPLOAD_TO_HUGGINGFACE=%s\r\n' "${UPLOAD_TO_HUGGINGFACE:-}"
                printf 'PUSH_DOC=%s\r\n' "${PUSH_DOC:-}"
              }

              send_mail() {
                subject_status="$1"

                if [ -z "${SMTP_NOTIFY_TO:-}" ]; then
                  echo "SMTP_NOTIFY_TO is empty; skipping ${subject_status} notification."
                  return 0
                fi

                mail_from="${SMTP_MAIL_FROM:-heavyedge-feature-models@localhost}"
                smtp_host="${SMTP_HOST:-127.0.0.1}"
                smtp_port="${SMTP_PORT:-587}"
                retries="${SMTP_NOTIFY_RETRIES:-12}"
                delay="${SMTP_NOTIFY_RETRY_DELAY:-5}"

                set -- \
                  --fail \
                  --show-error \
                  --silent \
                  --connect-timeout 10 \
                  --max-time 30 \
                  --url "smtp://${smtp_host}:${smtp_port}" \
                  --mail-from "${mail_from}" \
                  --upload-file -

                rcpt_count=0
                old_ifs="${IFS}"
                IFS=', '
                for recipient in ${SMTP_NOTIFY_TO}; do
                  if [ -n "${recipient}" ]; then
                    set -- "$@" --mail-rcpt "${recipient}"
                    rcpt_count=$((rcpt_count + 1))
                  fi
                done
                IFS="${old_ifs}"

                if [ "${rcpt_count}" -eq 0 ]; then
                  echo "SMTP_NOTIFY_TO has no recipients; skipping ${subject_status} notification."
                  return 0
                fi

                attempt=1
                while [ "${attempt}" -le "${retries}" ]; do
                  if build_message | curl "$@"; then
                    echo "Sent ${subject_status} notification to ${SMTP_NOTIFY_TO}."
                    return 0
                  fi

                  echo "Notification attempt ${attempt}/${retries} failed." >&2
                  if [ "${attempt}" -lt "${retries}" ]; then
                    sleep "${delay}"
                  fi
                  attempt=$((attempt + 1))
                done

                echo "Failed to send ${subject_status} notification." >&2
                return 1
              }

              send_mail started || true

              while [ ! -f "${result_file}" ]; do
                sleep 5
              done

              . "${result_file}"

              case "${status:-}" in
                succeeded|failed)
                  send_mail "${status}" || true
                  ;;
                *)
                  echo "Unknown deploy result status '${status:-}'; sending failure notification." >&2
                  send_mail failed || true
                  ;;
              esac
          volumeMounts:
            - name: postfix-state
              mountPath: /var/run/heavyedge
          env:
            - name: JOB_NAME
              value: "${JOB_NAME}"
            - name: GIT_SHA
              value: "${GIT_SHA}"
            - name: GITHUB_REPOSITORY
              value: "${GITHUB_REPOSITORY}"
            - name: GITHUB_RUN_URL
              value: "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            - name: TAG_NAME
              value: "${RELEASE_TAG_NAME}"
            - name: EVENT_NAME
              value: "${EVENT_NAME}"
            - name: HEAVYEDGE_TEST_MODE
              value: "${HEAVYEDGE_TEST_MODE}"
            - name: UPLOAD_TO_HUGGINGFACE
              value: "${UPLOAD_TO_HUGGINGFACE}"
            - name: PUSH_DOC
              value: "${PUSH_DOC}"
            - name: SMTP_HOST
              value: "127.0.0.1"
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_NOTIFY_TO
              value: "${SMTP_NOTIFY_TO}"
            - name: SMTP_MAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: gmail-smtp-relay
                  key: GMAIL_USERNAME
        - name: github-app-token
          image: ruby:3.4.10-alpine3.24
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              set -f
              umask 077

              state_dir="${HEAVYEDGE_STATE_DIR:-/var/run/heavyedge}"
              token_file="${GITHUB_APP_TOKEN_FILE:-${state_dir}/github-app-token}"
              token_metadata_file="${GITHUB_APP_TOKEN_METADATA_FILE:-${state_dir}/github-app-token.json}"
              token_error_file="${GITHUB_APP_TOKEN_ERROR_FILE:-${state_dir}/github-app-token-error}"
              token_done_file="${GITHUB_APP_TOKEN_DONE_FILE:-${state_dir}/github-app-token-complete}"
              refresh_interval="${GITHUB_APP_TOKEN_REFRESH_INTERVAL_SECONDS:-2700}"

              mkdir -p "$(dirname "${token_file}")"

              missing=""
              if [ -z "${GH_APP_ID:-}" ]; then
                missing="${missing} GH_APP_ID"
              fi
              if [ -z "${GH_APP_PRIVATE_KEY:-}" ]; then
                missing="${missing} GH_APP_PRIVATE_KEY"
              fi
              if [ -z "${GH_APP_INSTALLATION_ID:-}" ] && [ -z "${GITHUB_REPOSITORY:-}" ]; then
                missing="${missing} GH_APP_INSTALLATION_ID-or-GITHUB_REPOSITORY"
              fi

              if [ -n "${missing}" ]; then
                echo "GitHub App token environment is incomplete (missing:${missing}); token sidecar disabled." | tee "${token_error_file}" >&2
                exit 0
              fi

              refresh_github_app_token() {
                GITHUB_APP_TOKEN_FILE="${token_file}" \
                  GITHUB_APP_TOKEN_METADATA_FILE="${token_metadata_file}" \
                  GITHUB_APP_TOKEN_ERROR_FILE="${token_error_file}" \
                  ruby <<'RUBY'
              require "base64"
              require "fileutils"
              require "json"
              require "net/http"
              require "openssl"
              require "time"
              require "uri"

              def base64_url(data)
                Base64.urlsafe_encode64(data, padding: false)
              end

              def jwt_segment(payload)
                base64_url(JSON.generate(payload))
              end

              def github_request(method, url, token, payload = nil, allow_failure: false)
                uri = URI(url)
                request_class = {
                  "GET" => Net::HTTP::Get,
                  "POST" => Net::HTTP::Post,
                  "PATCH" => Net::HTTP::Patch,
                }.fetch(method)
                request = request_class.new(uri)
                request["Accept"] = "application/vnd.github+json"
                request["Authorization"] = "Bearer #{token}"
                request["X-GitHub-Api-Version"] = "2022-11-28"
                if payload
                  request["Content-Type"] = "application/json"
                  request.body = JSON.generate(payload)
                end

                response = Net::HTTP.start(uri.host, uri.port, use_ssl: uri.scheme == "https") do |http|
                  http.open_timeout = 10
                  http.read_timeout = 30
                  http.request(request)
                end

                status = response.code.to_i
                if status < 200 || status >= 300
                  return [status, response.body.to_s] if allow_failure

                  warn "GitHub API request failed: #{method} #{url} returned HTTP #{status}"
                  warn "Response body:"
                  warn response.body.to_s
                  if payload
                    warn "Request payload:"
                    warn JSON.generate(payload)
                  end
                  raise "GitHub API request failed"
                end

                body = response.body.to_s
                parsed_body = body.empty? ? nil : JSON.parse(body)
                [status, parsed_body]
              end

              def atomic_write(path, body)
                FileUtils.mkdir_p(File.dirname(path))
                tmp_path = "#{path}.#{Process.pid}.tmp"
                File.write(tmp_path, body)
                File.rename(tmp_path, path)
              end

              def write_error(path, error)
                atomic_write(path, "#{Time.now.utc.iso8601} #{error.class}: #{error.message}\n")
              rescue StandardError => write_error
                warn "Failed to write token error file #{path}: #{write_error.class}: #{write_error.message}"
              end

              begin
                owner = nil
                repo = nil
                if ENV["GITHUB_REPOSITORY"].to_s.include?("/")
                  owner, repo = ENV.fetch("GITHUB_REPOSITORY").split("/", 2)
                end

                private_key = OpenSSL::PKey.read(ENV.fetch("GH_APP_PRIVATE_KEY").gsub("\\n", "\n"))
                now = Time.now.to_i
                signing_input = [
                  jwt_segment({ "alg" => "RS256", "typ" => "JWT" }),
                  jwt_segment({ "iat" => now - 60, "exp" => now + 540, "iss" => ENV.fetch("GH_APP_ID") }),
                ].join(".")
                jwt = "#{signing_input}.#{base64_url(private_key.sign(OpenSSL::Digest::SHA256.new, signing_input))}"

                installation_id = ENV["GH_APP_INSTALLATION_ID"].to_s
                if installation_id.empty?
                  raise "GITHUB_REPOSITORY must be owner/repo when GH_APP_INSTALLATION_ID is not set" if owner.to_s.empty? || repo.to_s.empty?

                  _, installation = github_request("GET", "https://api.github.com/repos/#{owner}/#{repo}/installation", jwt)
                  installation_id = installation.fetch("id")
                end

                permissions_json = ENV["GITHUB_APP_TOKEN_PERMISSIONS"].to_s.strip
                token_payload = nil
                unless permissions_json.empty?
                  token_payload = { "permissions" => JSON.parse(permissions_json) }
                end

                _, token_response = github_request(
                  "POST",
                  "https://api.github.com/app/installations/#{installation_id}/access_tokens",
                  jwt,
                  token_payload,
                )

                token = token_response.fetch("token")
                expires_at = token_response["expires_at"].to_s
                metadata = {
                  "installation_id" => installation_id,
                  "repository" => ENV["GITHUB_REPOSITORY"].to_s,
                  "expires_at" => expires_at,
                  "permissions" => permissions_json.empty? ? "installation-default" : JSON.parse(permissions_json),
                  "updated_at" => Time.now.utc.iso8601,
                }

                atomic_write(ENV.fetch("GITHUB_APP_TOKEN_FILE"), "#{token}\n")
                atomic_write(ENV.fetch("GITHUB_APP_TOKEN_METADATA_FILE"), "#{JSON.pretty_generate(metadata)}\n")
                FileUtils.rm_f(ENV.fetch("GITHUB_APP_TOKEN_ERROR_FILE"))
                puts "Refreshed GitHub App installation token; expires_at=#{expires_at.empty? ? 'unknown' : expires_at}."
              rescue StandardError => error
                write_error(ENV.fetch("GITHUB_APP_TOKEN_ERROR_FILE"), error)
                warn "Failed to refresh GitHub App installation token: #{error.class}: #{error.message}"
                exit 1
              end
              RUBY
              }

              while :; do
                refresh_github_app_token || true

                elapsed=0
                while [ "${elapsed}" -lt "${refresh_interval}" ]; do
                  if [ -f "${token_done_file}" ]; then
                    exit 0
                  fi
                  sleep 5
                  elapsed=$((elapsed + 5))
                done
              done
          volumeMounts:
            - name: postfix-state
              mountPath: /var/run/heavyedge
          env:
            - name: GITHUB_REPOSITORY
              value: "${GITHUB_REPOSITORY}"
            - name: GH_APP_ID
              valueFrom:
                secretKeyRef:
                  name: github-app
                  key: GH_APP_ID
                  optional: true
            - name: GH_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: github-app
                  key: GH_APP_PRIVATE_KEY
                  optional: true
            - name: GH_APP_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: github-app
                  key: GH_APP_INSTALLATION_ID
                  optional: true
        - name: github-check
          image: ruby:3.4.10-alpine3.24
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              set -f

              state_dir="${HEAVYEDGE_STATE_DIR:-/var/run/heavyedge}"
              result_file="${DEPLOY_RESULT_FILE:-${state_dir}/deploy-result}"
              check_id_file="${GITHUB_CHECK_RUN_ID_FILE:-${state_dir}/github-check-id}"
              token_file="${GITHUB_APP_TOKEN_FILE:-${state_dir}/github-app-token}"
              token_error_file="${GITHUB_APP_TOKEN_ERROR_FILE:-${state_dir}/github-app-token-error}"
              token_done_file="${GITHUB_APP_TOKEN_DONE_FILE:-${state_dir}/github-app-token-complete}"
              token_wait_seconds="${GITHUB_APP_TOKEN_WAIT_SECONDS:-120}"

              finish_check_run() {
                mkdir -p "$(dirname "${token_done_file}")"
                touch "${token_done_file}"
              }

              trap finish_check_run EXIT

              wait_for_github_token() {
                waited=0
                while [ ! -s "${token_file}" ]; do
                  if [ -s "${token_error_file}" ]; then
                    echo "GitHub App token sidecar reported an error; skipping check-run update." >&2
                    cat "${token_error_file}" >&2
                    return 1
                  fi
                  if [ "${waited}" -ge "${token_wait_seconds}" ]; then
                    echo "Timed out waiting for GitHub App token at ${token_file}; skipping check-run update." >&2
                    return 1
                  fi
                  sleep 2
                  waited=$((waited + 2))
                done
              }

              update_github_check_run() {
                if ! wait_for_github_token; then
                  return 0
                fi

                CHECK_ACTION="$1" \
                  CHECK_ID_FILE="${check_id_file}" \
                  GITHUB_APP_TOKEN_FILE="${token_file}" \
                  ruby <<'RUBY'
              require "fileutils"
              require "json"
              require "net/http"
              require "time"
              require "uri"

              action = ENV.fetch("CHECK_ACTION")
              unless %w[started succeeded failed].include?(action)
                warn "Usage: github-check <started|succeeded|failed>"
                exit 2
              end

              check_name = ENV["GITHUB_CHECK_RUN_NAME"].to_s
              check_name = "GPU run" if check_name.empty?
              check_id_file = ENV.fetch("CHECK_ID_FILE")
              token_file = ENV.fetch("GITHUB_APP_TOKEN_FILE")

              missing = %w[GITHUB_REPOSITORY GIT_SHA].select do |name|
                ENV[name].to_s.empty?
              end

              unless missing.empty?
                warn "GitHub check-run environment is incomplete (missing #{missing.join(', ')}); skipping #{check_name} #{action} update."
                exit 0
              end

              token = File.read(token_file).strip
              if token.empty?
                warn "GitHub App token file #{token_file} is empty; skipping #{check_name} #{action} update."
                exit 0
              end

              owner, repo = ENV.fetch("GITHUB_REPOSITORY").split("/", 2)
              if owner.to_s.empty? || repo.to_s.empty?
                warn "Invalid GITHUB_REPOSITORY=#{ENV.fetch('GITHUB_REPOSITORY').inspect}; skipping #{check_name} #{action} update."
                exit 0
              end

              def github_request(method, url, token, payload = nil, allow_failure: false)
                uri = URI(url)
                request_class = {
                  "GET" => Net::HTTP::Get,
                  "POST" => Net::HTTP::Post,
                  "PATCH" => Net::HTTP::Patch,
                }.fetch(method)
                request = request_class.new(uri)
                request["Accept"] = "application/vnd.github+json"
                request["Authorization"] = "Bearer #{token}"
                request["X-GitHub-Api-Version"] = "2022-11-28"
                if payload
                  request["Content-Type"] = "application/json"
                  request.body = JSON.generate(payload)
                end

                response = Net::HTTP.start(uri.host, uri.port, use_ssl: uri.scheme == "https") do |http|
                  http.open_timeout = 10
                  http.read_timeout = 30
                  http.request(request)
                end

                status = response.code.to_i
                if status < 200 || status >= 300
                  return [status, response.body.to_s] if allow_failure

                  warn "GitHub API request failed: #{method} #{url} returned HTTP #{status}"
                  warn "Response body:"
                  warn response.body.to_s
                  if payload
                    warn "Request payload:"
                    warn JSON.generate(payload)
                  end
                  raise "GitHub API request failed"
                end

                body = response.body.to_s
                parsed_body = body.empty? ? nil : JSON.parse(body)
                [status, parsed_body]
              end

              def check_payload(action, payload_kind, check_name, git_sha, job_name, github_run_url)
                payload = {
                  "details_url" => github_run_url.to_s,
                  "output" => {
                    "title" => check_name,
                    "summary" => action == "started" ? "Kubernetes GPU job started." : "Kubernetes GPU job completed.",
                  },
                }

                now = Time.now.utc.iso8601
                case action
                when "started"
                  payload["status"] = "in_progress"
                  payload["started_at"] = now
                when "succeeded"
                  payload["status"] = "completed"
                  payload["conclusion"] = "success"
                  payload["completed_at"] = now
                  payload["output"]["summary"] = "Kubernetes GPU job succeeded."
                when "failed"
                  payload["status"] = "completed"
                  payload["conclusion"] = "failure"
                  payload["completed_at"] = now
                  payload["output"]["summary"] = "Kubernetes GPU job failed."
                end

                if payload_kind == "create"
                  payload["name"] = check_name
                  payload["head_sha"] = git_sha
                  payload["external_id"] = job_name.to_s
                end

                payload
              end

              git_sha = ENV.fetch("GIT_SHA")
              job_name = ENV["JOB_NAME"].to_s
              github_run_url = ENV["GITHUB_RUN_URL"].to_s
              api_url = "https://api.github.com/repos/#{owner}/#{repo}/check-runs"
              env_check_id = ENV["GITHUB_CHECK_RUN_ID"].to_s

              if action == "started"
                if !env_check_id.empty?
                  FileUtils.mkdir_p(File.dirname(check_id_file))
                  File.write(check_id_file, "#{env_check_id}\n")
                  payload = check_payload(action, "update", check_name, git_sha, job_name, github_run_url)
                  github_request("PATCH", "#{api_url}/#{env_check_id}", token, payload)
                else
                  commit_status, = github_request(
                    "GET",
                    "https://api.github.com/repos/#{owner}/#{repo}/commits/#{git_sha}",
                    token,
                    nil,
                    allow_failure: true,
                  )
                  if commit_status != 200
                    warn "Commit #{git_sha} was not found in #{owner}/#{repo}; GitHub returned HTTP #{commit_status}."
                    warn "The Checks API can only create a check run for a commit visible in the target repository."
                  end

                  payload = check_payload(action, "create", check_name, git_sha, job_name, github_run_url)
                  _, response = github_request("POST", api_url, token, payload)
                  FileUtils.mkdir_p(File.dirname(check_id_file))
                  File.write(check_id_file, "#{response.fetch('id')}\n")
                end
                exit 0
              end

              if !env_check_id.empty?
                payload = check_payload(action, "update", check_name, git_sha, job_name, github_run_url)
                github_request("PATCH", "#{api_url}/#{env_check_id}", token, payload)
              elsif File.size?(check_id_file)
                check_id = File.read(check_id_file).strip
                payload = check_payload(action, "update", check_name, git_sha, job_name, github_run_url)
                github_request("PATCH", "#{api_url}/#{check_id}", token, payload)
              else
                payload = check_payload(action, "create", check_name, git_sha, job_name, github_run_url)
                github_request("POST", api_url, token, payload)
              end
              RUBY
              }

              update_github_check_run started || true

              while [ ! -f "${result_file}" ]; do
                sleep 5
              done

              . "${result_file}"

              case "${status:-}" in
                succeeded|failed)
                  update_github_check_run "${status}" || true
                  ;;
                *)
                  echo "Unknown deploy result status '${status:-}'; reporting failure." >&2
                  update_github_check_run failed || true
                  ;;
              esac
          volumeMounts:
            - name: postfix-state
              mountPath: /var/run/heavyedge
          env:
            - name: JOB_NAME
              value: "${JOB_NAME}"
            - name: GIT_SHA
              value: "${GIT_SHA}"
            - name: GITHUB_REPOSITORY
              value: "${GITHUB_REPOSITORY}"
            - name: GITHUB_RUN_URL
              value: "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            - name: GITHUB_CHECK_RUN_ID
              value: "${GITHUB_CHECK_RUN_ID}"
        - name: postfix
          image: boky/postfix:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
          ports:
            - name: smtp
              containerPort: 587
          command: ["/bin/sh", "-c"]
          args:
            - |
              /scripts/run.sh &
              postfix_pid=$!
              while [ ! -f /var/run/heavyedge/notify-deploy-complete ]; do
                if ! kill -0 "${postfix_pid}" 2>/dev/null; then
                  wait "${postfix_pid}"
                  exit $?
                fi
                sleep 5
              done
              postfix stop || true
              kill "${postfix_pid}" 2>/dev/null || true
              wait "${postfix_pid}" 2>/dev/null || true
          env:
            - name: RELAYHOST
              value: "[smtp.gmail.com]:587"
            - name: RELAYHOST_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gmail-smtp-relay
                  key: GMAIL_USERNAME
            - name: RELAYHOST_PASSWORD_FILE
              value: "/run/secrets/gmail/GMAIL_APP_PASSWORD"
            - name: POSTFIX_smtp_tls_security_level
              value: "encrypt"
            - name: POSTFIX_mynetworks
              value: "127.0.0.0/8 [::1]/128"
            - name: ALLOW_EMPTY_SENDER_DOMAINS
              value: "true"
            - name: LOG_FORMAT
              value: "json"
          volumeMounts:
            - name: postfix-state
              mountPath: /var/run/heavyedge
            - name: gmail-smtp-relay
              mountPath: /run/secrets/gmail
              readOnly: true
