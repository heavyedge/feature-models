apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-registry
  template:
    metadata:
      labels:
        app: mock-registry
    spec:
      containers:
        - name: mock-registry
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python3", "/app/mock-registry.py"]
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: mock-registry
              mountPath: /app
              readOnly: true
      volumes:
        - name: mock-registry
          configMap:
            name: mock-registry
---
apiVersion: v1
kind: Service
metadata:
  name: mock-registry
spec:
  selector:
    app: mock-registry
  ports:
    - name: http
      port: 5000
      targetPort: 5000
