        - name: postfix
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
          ports:
            - name: smtp
              containerPort: 587
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu

              if [ -z "${SMTP_NOTIFY_TO:-}" ]; then
                echo "SMTP_NOTIFY_TO is empty; disabling SMTP capture sidecar."
                exit 0
              fi

              python3 - <<'PY'
              import os
              import socket
              import time


              done_file = os.environ.get(
                  "NOTIFY_DEPLOY_DONE_FILE",
                  "/var/run/heavyedge/notify-deploy-complete",
              )


              def recv_line(connection):
                  chunks = []
                  while True:
                      chunk = connection.recv(1)
                      if not chunk:
                          break
                      chunks.append(chunk)
                      if chunk == b"\n":
                          break
                  return b"".join(chunks).decode("utf-8", errors="replace")


              def send_line(connection, line):
                  connection.sendall(line.encode("utf-8"))


              def handle_message(message):
                  normalized = message.replace("\r\n", "\n")
                  print("EMAIL_CAPTURED", flush=True)
                  if "Subject: [started]" in normalized:
                      print("EMAIL_STATUS=started", flush=True)
                  if "Subject: [failed]" in normalized:
                      print("EMAIL_STATUS=failed", flush=True)
                  if "Subject: [succeeded]" in normalized:
                      print("EMAIL_STATUS=succeeded", flush=True)
                  for line in normalized.splitlines():
                      if line.startswith(("From:", "To:", "Subject:", "Job:", "Git SHA:")):
                          print(line, flush=True)


              def handle_connection(connection):
                  with connection:
                      send_line(connection, "220 heavyedge-ci-smtp ESMTP\r\n")
                      data_mode = False
                      data_lines = []

                      while True:
                          line = recv_line(connection)
                          if not line:
                              return
                          command = line.rstrip("\r\n")

                          if data_mode:
                              if command == ".":
                                  handle_message("".join(data_lines))
                                  data_lines = []
                                  data_mode = False
                                  send_line(connection, "250 OK\r\n")
                              else:
                                  data_lines.append(line)
                              continue

                          upper = command.upper()
                          if upper.startswith(("EHLO", "HELO")):
                              send_line(connection, "250-heavyedge-ci-smtp\r\n250 OK\r\n")
                          elif upper.startswith(("MAIL FROM", "RCPT TO")):
                              send_line(connection, "250 OK\r\n")
                          elif upper == "DATA":
                              data_mode = True
                              send_line(connection, "354 End data with <CR><LF>.<CR><LF>\r\n")
                          elif upper == "QUIT":
                              send_line(connection, "221 Bye\r\n")
                              return
                          else:
                              send_line(connection, "250 OK\r\n")


              with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as server:
                  server.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
                  server.bind(("0.0.0.0", 587))
                  server.listen()
                  server.settimeout(1)
                  print("SMTP_CAPTURE_READY", flush=True)

                  while True:
                      if os.path.exists(done_file):
                          deadline = time.time() + 2
                          while time.time() < deadline:
                              try:
                                  connection, _address = server.accept()
                              except socket.timeout:
                                  break
                              handle_connection(connection)
                          break

                      try:
                          connection, _address = server.accept()
                      except socket.timeout:
                          continue
                      handle_connection(connection)
              PY
          volumeMounts:
            - name: postfix-state
              mountPath: /var/run/heavyedge
          env:
            - name: SMTP_NOTIFY_TO
              value: "${SMTP_NOTIFY_TO}"
