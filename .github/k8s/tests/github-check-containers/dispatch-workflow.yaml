        - name: dispatch-workflow
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              python3 - <<'PY'
              import json
              import os
              import time
              from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer


              done_file = os.environ.get(
                  "GITHUB_APP_TOKEN_DONE_FILE",
                  "/var/run/heavyedge/github-app-token-complete",
              )
              ready_file = os.environ.get(
                  "GITHUB_API_READY_FILE",
                  "/var/run/heavyedge/github-api-ready",
              )


              class Handler(BaseHTTPRequestHandler):
                  def log_message(self, _format, *_args):
                      return

                  def do_POST(self):
                      self.handle_check_request("POST")

                  def do_PATCH(self):
                      self.handle_check_request("PATCH")

                  def handle_check_request(self, method):
                      length = int(self.headers.get("Content-Length", "0"))
                      body = self.rfile.read(length).decode("utf-8")
                      payload = json.loads(body) if body else {}
                      output = payload.get("output") or {}
                      print(f"CHECK_METHOD={method}", flush=True)
                      print(f"CHECK_PATH={self.path}", flush=True)
                      print(f"CHECK_NAME={payload.get('name', output.get('title', ''))}", flush=True)
                      print(f"CHECK_CONCLUSION={payload.get('conclusion', '')}", flush=True)
                      print(f"CHECK_SUMMARY={output.get('summary', '')}", flush=True)

                      response = {"id": 987654} if method == "POST" else {}
                      encoded = json.dumps(response).encode("utf-8")
                      self.send_response(201 if method == "POST" else 200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(encoded)))
                      self.end_headers()
                      self.wfile.write(encoded)


              server = ThreadingHTTPServer(("0.0.0.0", 8080), Handler)
              server.timeout = 1
              os.makedirs(os.path.dirname(ready_file), exist_ok=True)
              with open(ready_file, "w", encoding="utf-8") as file:
                  file.write("ready\n")
              print("GITHUB_API_CAPTURE_READY", flush=True)

              while True:
                  server.handle_request()
                  if os.path.exists(done_file):
                      deadline = time.time() + 2
                      while time.time() < deadline:
                          server.handle_request()
                      break

              server.server_close()
              PY
          volumeMounts:
            - name: postfix-state
              mountPath: /var/run/heavyedge
          env:
            - name: GITHUB_APP_TOKEN_DONE_FILE
              value: "/var/run/heavyedge/github-app-token-complete"
            - name: GITHUB_API_READY_FILE
              value: "/var/run/heavyedge/github-api-ready"
