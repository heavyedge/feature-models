        - name: github-app-token
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              state_dir="${HEAVYEDGE_STATE_DIR:-/var/run/heavyedge}"
              token_file="${GITHUB_APP_TOKEN_FILE:-${state_dir}/github-app-token}"
              api_ready_file="${GITHUB_API_READY_FILE:-${state_dir}/github-api-ready}"
              dispatch_done_file="${WORKFLOW_DISPATCH_DONE_FILE:-${state_dir}/workflow-dispatch-complete}"
              mkdir -p "$(dirname "${token_file}")"

              waited=0
              while [ ! -f "${api_ready_file}" ] && [ "${waited}" -lt 120 ]; do
                sleep 1
                waited=$((waited + 1))
              done
              if [ ! -f "${api_ready_file}" ]; then
                echo "Timed out waiting for fake GitHub API." >&2
                exit 1
              fi

              printf '%s\n' "fake-github-token" > "${token_file}"
              echo "GITHUB_APP_TOKEN_READY"

              waited=0
              while [ ! -f "${dispatch_done_file}" ] && [ "${waited}" -lt 300 ]; do
                sleep 1
                waited=$((waited + 1))
              done
          volumeMounts:
            - name: postfix-state
              mountPath: /var/run/heavyedge
