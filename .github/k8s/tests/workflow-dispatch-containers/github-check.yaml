        - name: github-check
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              python3 - <<'PY'
              import json
              import os
              import time
              from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer


              state_dir = os.environ.get("HEAVYEDGE_STATE_DIR", "/var/run/heavyedge")
              ready_file = os.path.join(state_dir, "github-api-ready")
              dispatch_done_file = os.path.join(state_dir, "workflow-dispatch-complete")


              class Handler(BaseHTTPRequestHandler):
                  def log_message(self, _format, *_args):
                      return

                  def do_POST(self):
                      length = int(self.headers.get("Content-Length", "0"))
                      body = self.rfile.read(length).decode("utf-8")
                      payload = json.loads(body) if body else {}
                      print(f"DISPATCH_METHOD=POST", flush=True)
                      print(f"DISPATCH_PATH={self.path}", flush=True)
                      print(f"DISPATCH_EVENT_TYPE={payload.get('event_type', '')}", flush=True)
                      self.send_response(204)
                      self.end_headers()


              server = ThreadingHTTPServer(("0.0.0.0", 8080), Handler)
              server.timeout = 1
              os.makedirs(state_dir, exist_ok=True)
              with open(ready_file, "w", encoding="utf-8") as file:
                  file.write("ready\n")
              print("DISPATCH_API_CAPTURE_READY", flush=True)

              deadline = time.time() + 300
              while time.time() < deadline:
                  server.handle_request()
                  if os.path.exists(dispatch_done_file):
                      grace_deadline = time.time() + 2
                      while time.time() < grace_deadline:
                          server.handle_request()
                      break

              server.server_close()
              PY
          volumeMounts:
            - name: postfix-state
              mountPath: /var/run/heavyedge
