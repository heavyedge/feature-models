        - name: build
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu

              state_dir="${HEAVYEDGE_STATE_DIR:-/var/run/heavyedge}"
              state_file="${DEPLOY_STATE_FILE:-${state_dir}/deploy-state.json}"
              heartbeat_file="${DEPLOY_BUILD_HEARTBEAT_FILE:-${state_dir}/build-heartbeat}"

              mkdir -p "$(dirname "${state_file}")"
              mkdir -p "$(dirname "${heartbeat_file}")"
              date +%s > "${heartbeat_file}"

              case "${BUILD_FAILURE_SCENARIO}" in
                failed-state)
                  printf '%s\n' "BUILD_FAILURE_SCENARIO=failed-state"
                  state_tmp_file="${state_file}.$$"
                  cat > "${state_tmp_file}" <<JSON
              {"checks":{"gpu_build":{"name":"GPU build","status":"failed","summary":"Test build published failed deploy state."}},"exit_code":42,"status":"failed"}
              JSON
                  mv "${state_tmp_file}" "${state_file}"
                  exit 42
                  ;;
                crash-no-state)
                  printf '%s\n' "BUILD_FAILURE_SCENARIO=crash-no-state"
                  exit 43
                  ;;
                *)
                  printf '%s\n' "Unknown BUILD_FAILURE_SCENARIO=${BUILD_FAILURE_SCENARIO}" >&2
                  exit 44
                  ;;
              esac
          volumeMounts:
            - name: postfix-state
              mountPath: /var/run/heavyedge
          env:
            - name: BUILD_FAILURE_SCENARIO
              value: "${BUILD_FAILURE_SCENARIO}"
            - name: DEPLOY_STATE_FILE
              value: "/var/run/heavyedge/deploy-state.json"
