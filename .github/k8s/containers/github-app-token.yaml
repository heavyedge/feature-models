        - name: github-app-token
          image: ruby:3.4.10-alpine3.24
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              set -f
              umask 077

              state_dir="${HEAVYEDGE_STATE_DIR:-/var/run/heavyedge}"
              token_file="${GITHUB_APP_TOKEN_FILE:-${state_dir}/github-app-token}"
              token_metadata_file="${GITHUB_APP_TOKEN_METADATA_FILE:-${state_dir}/github-app-token.json}"
              token_error_file="${GITHUB_APP_TOKEN_ERROR_FILE:-${state_dir}/github-app-token-error}"
              token_done_file="${GITHUB_APP_TOKEN_DONE_FILE:-${state_dir}/github-app-token-complete}"
              refresh_interval="${GITHUB_APP_TOKEN_REFRESH_INTERVAL_SECONDS:-2700}"

              mkdir -p "$(dirname "${token_file}")"

              missing=""
              if [ -z "${GH_APP_ID:-}" ]; then
                missing="${missing} GH_APP_ID"
              fi
              if [ -z "${GH_APP_PRIVATE_KEY:-}" ]; then
                missing="${missing} GH_APP_PRIVATE_KEY"
              fi
              if [ -z "${GH_APP_INSTALLATION_ID:-}" ] && [ -z "${GITHUB_REPOSITORY:-}" ]; then
                missing="${missing} GH_APP_INSTALLATION_ID-or-GITHUB_REPOSITORY"
              fi

              if [ -n "${missing}" ]; then
                echo "GitHub App token environment is incomplete (missing:${missing}); token sidecar disabled." | tee "${token_error_file}" >&2
                exit 0
              fi

              refresh_github_app_token() {
                GITHUB_APP_TOKEN_FILE="${token_file}" \
                  GITHUB_APP_TOKEN_METADATA_FILE="${token_metadata_file}" \
                  GITHUB_APP_TOKEN_ERROR_FILE="${token_error_file}" \
                  ruby <<'RUBY'
              require "base64"
              require "fileutils"
              require "json"
              require "net/http"
              require "openssl"
              require "time"
              require "uri"

              def base64_url(data)
                Base64.urlsafe_encode64(data, padding: false)
              end

              def jwt_segment(payload)
                base64_url(JSON.generate(payload))
              end

              def github_request(method, url, token, payload = nil, allow_failure: false)
                uri = URI(url)
                request_class = {
                  "GET" => Net::HTTP::Get,
                  "POST" => Net::HTTP::Post,
                  "PATCH" => Net::HTTP::Patch,
                }.fetch(method)
                request = request_class.new(uri)
                request["Accept"] = "application/vnd.github+json"
                request["Authorization"] = "Bearer #{token}"
                request["X-GitHub-Api-Version"] = "2022-11-28"
                if payload
                  request["Content-Type"] = "application/json"
                  request.body = JSON.generate(payload)
                end

                response = Net::HTTP.start(uri.host, uri.port, use_ssl: uri.scheme == "https") do |http|
                  http.open_timeout = 10
                  http.read_timeout = 30
                  http.request(request)
                end

                status = response.code.to_i
                if status < 200 || status >= 300
                  return [status, response.body.to_s] if allow_failure

                  warn "GitHub API request failed: #{method} #{url} returned HTTP #{status}"
                  warn "Response body:"
                  warn response.body.to_s
                  if payload
                    warn "Request payload:"
                    warn JSON.generate(payload)
                  end
                  raise "GitHub API request failed"
                end

                body = response.body.to_s
                parsed_body = body.empty? ? nil : JSON.parse(body)
                [status, parsed_body]
              end

              def atomic_write(path, body)
                FileUtils.mkdir_p(File.dirname(path))
                tmp_path = "#{path}.#{Process.pid}.tmp"
                File.write(tmp_path, body)
                File.rename(tmp_path, path)
              end

              def write_error(path, error)
                atomic_write(path, "#{Time.now.utc.iso8601} #{error.class}: #{error.message}\n")
              rescue StandardError => write_error
                warn "Failed to write token error file #{path}: #{write_error.class}: #{write_error.message}"
              end

              begin
                owner = nil
                repo = nil
                if ENV["GITHUB_REPOSITORY"].to_s.include?("/")
                  owner, repo = ENV.fetch("GITHUB_REPOSITORY").split("/", 2)
                end

                private_key = OpenSSL::PKey.read(ENV.fetch("GH_APP_PRIVATE_KEY").gsub("\\n", "\n"))
                now = Time.now.to_i
                signing_input = [
                  jwt_segment({ "alg" => "RS256", "typ" => "JWT" }),
                  jwt_segment({ "iat" => now - 60, "exp" => now + 540, "iss" => ENV.fetch("GH_APP_ID") }),
                ].join(".")
                jwt = "#{signing_input}.#{base64_url(private_key.sign(OpenSSL::Digest::SHA256.new, signing_input))}"

                installation_id = ENV["GH_APP_INSTALLATION_ID"].to_s
                if installation_id.empty?
                  raise "GITHUB_REPOSITORY must be owner/repo when GH_APP_INSTALLATION_ID is not set" if owner.to_s.empty? || repo.to_s.empty?

                  _, installation = github_request("GET", "https://api.github.com/repos/#{owner}/#{repo}/installation", jwt)
                  installation_id = installation.fetch("id")
                end

                permissions_json = ENV["GITHUB_APP_TOKEN_PERMISSIONS"].to_s.strip
                token_payload = nil
                unless permissions_json.empty?
                  token_payload = { "permissions" => JSON.parse(permissions_json) }
                end

                _, token_response = github_request(
                  "POST",
                  "https://api.github.com/app/installations/#{installation_id}/access_tokens",
                  jwt,
                  token_payload,
                )

                token = token_response.fetch("token")
                expires_at = token_response["expires_at"].to_s
                metadata = {
                  "installation_id" => installation_id,
                  "repository" => ENV["GITHUB_REPOSITORY"].to_s,
                  "expires_at" => expires_at,
                  "permissions" => permissions_json.empty? ? "installation-default" : JSON.parse(permissions_json),
                  "updated_at" => Time.now.utc.iso8601,
                }

                atomic_write(ENV.fetch("GITHUB_APP_TOKEN_FILE"), "#{token}\n")
                atomic_write(ENV.fetch("GITHUB_APP_TOKEN_METADATA_FILE"), "#{JSON.pretty_generate(metadata)}\n")
                FileUtils.rm_f(ENV.fetch("GITHUB_APP_TOKEN_ERROR_FILE"))
                puts "Refreshed GitHub App installation token; expires_at=#{expires_at.empty? ? 'unknown' : expires_at}."
              rescue StandardError => error
                write_error(ENV.fetch("GITHUB_APP_TOKEN_ERROR_FILE"), error)
                warn "Failed to refresh GitHub App installation token: #{error.class}: #{error.message}"
                exit 1
              end
              RUBY
              }

              while :; do
                refresh_github_app_token || true

                elapsed=0
                while [ "${elapsed}" -lt "${refresh_interval}" ]; do
                  if [ -f "${token_done_file}" ]; then
                    exit 0
                  fi
                  sleep 5
                  elapsed=$((elapsed + 5))
                done
              done
          volumeMounts:
            - name: postfix-state
              mountPath: /var/run/heavyedge
          env:
            - name: GITHUB_REPOSITORY
              value: "${GITHUB_REPOSITORY}"
            - name: GITHUB_APP_TOKEN_PERMISSIONS
              value: '{"contents":"write","checks":"write"}'
            - name: GH_APP_ID
              valueFrom:
                secretKeyRef:
                  name: github-app
                  key: GH_APP_ID
                  optional: true
            - name: GH_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: github-app
                  key: GH_APP_PRIVATE_KEY
                  optional: true
            - name: GH_APP_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: github-app
                  key: GH_APP_INSTALLATION_ID
                  optional: true
