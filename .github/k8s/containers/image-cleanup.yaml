        - name: image-cleanup
          image: curlimages/curl:8.21.0
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu

              state_dir="${HEAVYEDGE_STATE_DIR:-/var/run/heavyedge}"
              state_file="${DEPLOY_STATE_FILE:-${state_dir}/deploy-state.json}"

              while [ ! -f "${state_file}" ]; do
                sleep 5
              done

              printf '%s' "${DELETE_IMAGE_SCRIPT_BASE64:?missing delete image script}" | base64 -d > /tmp/delete-image.sh
              sh /tmp/delete-image.sh
          volumeMounts:
            - name: postfix-state
              mountPath: /var/run/heavyedge
          env:
            - name: DELETE_IMAGE_SCRIPT_BASE64
              value: "${DELETE_IMAGE_SCRIPT_BASE64}"
            - name: DOCKER_REGISTRY
              value: "${DOCKER_REGISTRY}"
            - name: DOCKER_REPOSITORY
              value: "${DOCKER_USERNAME}/heavyedge/feature-models"
            - name: DOCKER_TAG
              value: "${DOCKER_TAG}"
            - name: TEMP_DOCKER_TAG
              value: "${TEMP_DOCKER_TAG}"
            - name: DOCKER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: docker-registry-cleanup
                  key: DOCKER_USERNAME
                  optional: true
            - name: DOCKER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: docker-registry-cleanup
                  key: DOCKER_PASSWORD
                  optional: true
