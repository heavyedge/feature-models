        - name: build
          image: ${DOCKER_REGISTRY}/${DOCKER_USERNAME}/heavyedge/feature-models:${DOCKER_TAG}
          imagePullPolicy: Always
          resources:
            requests:
              memory: "4Gi"
              cpu: "${CPU_REQUEST}"
              nvidia.com/gpu: "${GPU_REQUEST}"
            limits:
              memory: "16Gi"
              cpu: "${CPU_REQUEST}"
              nvidia.com/gpu: "${GPU_REQUEST}"
          command: ["/bin/sh", "-c"]
          args:
            - |
              state_dir="${HEAVYEDGE_STATE_DIR:-/var/run/heavyedge}"
              state_file="${DEPLOY_STATE_FILE:-${state_dir}/deploy-state.json}"
              metadata_tmp_file="${DEPLOY_METADATA_TMP_FILE:-/tmp/deploy-metadata.json}"
              checks_tmp_file="${DEPLOY_CHECKS_TMP_FILE:-/tmp/deploy-checks.json}"
              heartbeat_file="${DEPLOY_BUILD_HEARTBEAT_FILE:-${state_dir}/build-heartbeat}"
              heartbeat_interval="${DEPLOY_BUILD_HEARTBEAT_INTERVAL_SECONDS:-5}"

              mkdir -p "$(dirname "${state_file}")"
              mkdir -p "$(dirname "${heartbeat_file}")"

              write_heartbeat() {
                heartbeat_tmp_file="${heartbeat_file}.$$"
                date +%s > "${heartbeat_tmp_file}"
                mv "${heartbeat_tmp_file}" "${heartbeat_file}"
              }

              (
                while :; do
                  write_heartbeat
                  sleep "${heartbeat_interval}"
                done
              ) &
              heartbeat_pid=$!

              finish_heartbeat() {
                kill "${heartbeat_pid}" 2>/dev/null || true
                wait "${heartbeat_pid}" 2>/dev/null || true
              }

              trap finish_heartbeat EXIT

              sh .github/scripts/deploy.sh
              exit_code=$?

              if [ "${exit_code}" -eq 0 ]; then
                result_status=succeeded
              else
                result_status=failed
              fi

              state_tmp_file="${state_file}.$$"
              if ! DEPLOY_STATUS="${result_status}" \
                DEPLOY_EXIT_CODE="${exit_code}" \
                DEPLOY_METADATA_TMP_FILE="${metadata_tmp_file}" \
                DEPLOY_CHECKS_TMP_FILE="${checks_tmp_file}" \
                DEPLOY_STATE_TMP_FILE="${state_tmp_file}" \
                python3 <<'PY'
              import json
              import os
              import sys

              metadata_file = os.environ["DEPLOY_METADATA_TMP_FILE"]
              checks_file = os.environ["DEPLOY_CHECKS_TMP_FILE"]
              payload = {}
              if os.path.exists(metadata_file):
                  with open(metadata_file, encoding="utf-8") as file:
                      parsed = json.load(file)
                  if isinstance(parsed, dict):
                      payload.update(parsed)
                  else:
                      print(f"Ignoring non-object deploy metadata in {metadata_file}", file=sys.stderr)

              if os.path.exists(checks_file):
                  with open(checks_file, encoding="utf-8") as file:
                      checks = json.load(file)
                  if isinstance(checks, dict):
                      payload["checks"] = checks
                  else:
                      print(f"Ignoring non-object deploy checks in {checks_file}", file=sys.stderr)

              payload["status"] = os.environ["DEPLOY_STATUS"]
              payload["exit_code"] = int(os.environ["DEPLOY_EXIT_CODE"])

              with open(os.environ["DEPLOY_STATE_TMP_FILE"], "w", encoding="utf-8") as file:
                  json.dump(payload, file, sort_keys=True)
                  file.write("\n")
              PY
              then
                printf '{"exit_code":%s,"status":"%s"}\n' "${exit_code}" "${result_status}" > "${state_tmp_file}"
              fi
              mv "${state_tmp_file}" "${state_file}"

              exit "${exit_code}"
          volumeMounts:
            - name: postfix-state
              mountPath: /var/run/heavyedge
          env:
            - name: JOB_NAME
              value: "${JOB_NAME}"
            - name: GIT_SHA
              value: "${GIT_SHA}"
            - name: GITHUB_REPOSITORY
              value: "${GITHUB_REPOSITORY}"
            - name: GITHUB_RUN_URL
              value: "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            - name: TAG_NAME
              value: "${RELEASE_TAG_NAME}"
            - name: EVENT_NAME
              value: "${EVENT_NAME}"
            - name: HEAVYEDGE_TEST_MODE
              value: "${HEAVYEDGE_TEST_MODE}"
            - name: UPLOAD_TO_HUGGINGFACE
              value: "${UPLOAD_TO_HUGGINGFACE}"
            - name: PUSH_DOC
              value: "${PUSH_DOC}"
            - name: DEPLOY_STATE_FILE
              value: "/var/run/heavyedge/deploy-state.json"
            - name: DEPLOY_METADATA_TMP_FILE
              value: "/tmp/deploy-metadata.json"
            - name: DEPLOY_CHECKS_TMP_FILE
              value: "/tmp/deploy-checks.json"
            - name: GIT_AUTHOR_NAME
              value: "${GIT_AUTHOR_NAME}"
            - name: GIT_AUTHOR_EMAIL
              value: "${GIT_AUTHOR_EMAIL}"
            - name: HUGGINGFACE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: huggingface-token
                  key: HUGGINGFACE_TOKEN
                  optional: true
