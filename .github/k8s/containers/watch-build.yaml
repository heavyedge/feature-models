        - name: watch-build
          image: curlimages/curl:8.21.0
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu

              state_dir="${HEAVYEDGE_STATE_DIR:-/var/run/heavyedge}"
              state_file="${DEPLOY_STATE_FILE:-${state_dir}/deploy-state.json}"
              heartbeat_file="${DEPLOY_BUILD_HEARTBEAT_FILE:-${state_dir}/build-heartbeat}"
              poll_seconds="${DEPLOY_BUILD_WATCH_POLL_SECONDS:-5}"
              initial_timeout_seconds="${DEPLOY_BUILD_INITIAL_TIMEOUT_SECONDS:-600}"
              heartbeat_timeout_seconds="${DEPLOY_BUILD_HEARTBEAT_TIMEOUT_SECONDS:-120}"
              started_at="$(date +%s)"

              write_failed_state() {
                mkdir -p "$(dirname "${state_file}")"
                if [ -f "${state_file}" ]; then
                  return 0
                fi

                state_tmp_file="${state_file}.watch-build.$$"
                cat > "${state_tmp_file}" <<'JSON'
              {"checks":{"gpu_build":{"name":"GPU build","status":"failed","summary":"Build container stopped before publishing deploy state."},"upload_doc":{"name":"Upload document","status":"failed","summary":"Build container stopped before publishing deploy state."},"upload_model":{"name":"Upload model","status":"failed","summary":"Build container stopped before publishing deploy state."}},"exit_code":255,"failure_reason":"build container stopped before publishing deploy state","status":"failed"}
              JSON
                if [ ! -f "${state_file}" ]; then
                  mv "${state_tmp_file}" "${state_file}"
                else
                  rm -f "${state_tmp_file}"
                fi
              }

              while [ ! -f "${state_file}" ]; do
                now="$(date +%s)"

                if [ -f "${heartbeat_file}" ]; then
                  heartbeat_at="$(cat "${heartbeat_file}" 2>/dev/null || true)"
                  case "${heartbeat_at}" in
                    ''|*[!0-9]*)
                      heartbeat_at=0
                      ;;
                  esac

                  if [ $((now - heartbeat_at)) -ge "${heartbeat_timeout_seconds}" ]; then
                    echo "Build heartbeat is stale; publishing failed deploy state."
                    write_failed_state
                    exit 0
                  fi
                elif [ $((now - started_at)) -ge "${initial_timeout_seconds}" ]; then
                  echo "Build heartbeat was not created; publishing failed deploy state."
                  write_failed_state
                  exit 0
                fi

                sleep "${poll_seconds}"
              done
          volumeMounts:
            - name: postfix-state
              mountPath: /var/run/heavyedge
