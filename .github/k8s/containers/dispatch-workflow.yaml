        - name: dispatch-workflow
          image: ruby:3.4.10-alpine3.24
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              set -f

              state_dir="${HEAVYEDGE_STATE_DIR:-/var/run/heavyedge}"
              state_file="${DEPLOY_STATE_FILE:-${state_dir}/deploy-state.json}"
              token_file="${GITHUB_APP_TOKEN_FILE:-${state_dir}/github-app-token}"
              token_error_file="${GITHUB_APP_TOKEN_ERROR_FILE:-${state_dir}/github-app-token-error}"
              token_wait_seconds="${GITHUB_APP_TOKEN_WAIT_SECONDS:-120}"

              wait_for_github_token() {
                waited=0
                while [ ! -s "${token_file}" ]; do
                  if [ -s "${token_error_file}" ]; then
                    echo "GitHub App token sidecar reported an error; skipping image workflow dispatch." >&2
                    cat "${token_error_file}" >&2
                    return 1
                  fi
                  if [ "${waited}" -ge "${token_wait_seconds}" ]; then
                    echo "Timed out waiting for GitHub App token at ${token_file}; skipping image workflow dispatch." >&2
                    return 1
                  fi
                  sleep 2
                  waited=$((waited + 2))
                done
              }

              dispatch_image_workflow() {
                if ! wait_for_github_token; then
                  return 0
                fi

                GITHUB_APP_TOKEN_FILE="${token_file}" \
                  DEPLOY_STATE_FILE="${state_file}" \
                  ruby <<'RUBY'
              require "json"
              require "net/http"
              require "time"
              require "uri"

              missing = %w[GITHUB_REPOSITORY GIT_SHA].select do |name|
                ENV[name].to_s.empty?
              end

              unless missing.empty?
                warn "Image workflow dispatch environment is incomplete (missing #{missing.join(', ')}); skipping dispatch."
                exit 0
              end

              token = File.read(ENV.fetch("GITHUB_APP_TOKEN_FILE")).strip
              if token.empty?
                warn "GitHub App token file is empty; skipping image workflow dispatch."
                exit 0
              end

              state_file = ENV.fetch("DEPLOY_STATE_FILE")
              deploy_state = File.size?(state_file) ? JSON.parse(File.read(state_file)) : {}
              deploy_state = {} unless deploy_state.is_a?(Hash)

              owner, repo = ENV.fetch("GITHUB_REPOSITORY").split("/", 2)
              if owner.to_s.empty? || repo.to_s.empty?
                warn "Invalid GITHUB_REPOSITORY=#{ENV.fetch('GITHUB_REPOSITORY').inspect}; skipping image workflow dispatch."
                exit 0
              end

              payload = {
                "event_type" => ENV["IMAGE_WORKFLOW_EVENT_TYPE"].to_s.empty? ? "build image" : ENV["IMAGE_WORKFLOW_EVENT_TYPE"],
                "client_payload" => {
                  "model" => {
                    "repo" => deploy_state["model_repo"].to_s,
                    "revision" => deploy_state["model_revision"].to_s,
                  },
                },
              }

              uri = URI("https://api.github.com/repos/#{owner}/#{repo}/dispatches")
              request = Net::HTTP::Post.new(uri)
              request["Accept"] = "application/vnd.github+json"
              request["Authorization"] = "Bearer #{token}"
              request["Content-Type"] = "application/json"
              request["X-GitHub-Api-Version"] = "2022-11-28"
              request.body = JSON.generate(payload)

              response = Net::HTTP.start(uri.host, uri.port, use_ssl: true) do |http|
                http.open_timeout = 10
                http.read_timeout = 30
                http.request(request)
              end

              status = response.code.to_i
              if status < 200 || status >= 300
                warn "Image workflow dispatch failed with HTTP #{status}."
                warn response.body.to_s
                exit 1
              end

              puts "Dispatched image workflow event #{payload.fetch('event_type')} for #{ENV.fetch('GIT_SHA')}."
              RUBY
              }

              while [ ! -f "${state_file}" ]; do
                sleep 5
              done

              dispatch_image_workflow || true
          volumeMounts:
            - name: postfix-state
              mountPath: /var/run/heavyedge
          env:
            - name: JOB_NAME
              value: "${JOB_NAME}"
            - name: GIT_SHA
              value: "${GIT_SHA}"
            - name: GITHUB_REPOSITORY
              value: "${GITHUB_REPOSITORY}"
            - name: GITHUB_RUN_URL
              value: "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            - name: TAG_NAME
              value: "${RELEASE_TAG_NAME}"
            - name: EVENT_NAME
              value: "${EVENT_NAME}"
            - name: DOCKER_TAG
              value: "${DOCKER_TAG}"
            - name: DEPLOY_STATE_FILE
              value: "/var/run/heavyedge/deploy-state.json"
            - name: IMAGE_WORKFLOW_EVENT_TYPE
              value: "build image"
