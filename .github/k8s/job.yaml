apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: ${KUBE_NAMESPACE}
  annotations:
    creator: "${KUBE_USERNAME}"
spec:
  ttlSecondsAfterFinished: ${TTL_SECONDS_AFTER_FINISHED}
  backoffLimit: 0
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
        creator: "${KUBE_USERNAME}"
    spec:
      nodeSelector:
          mlx.navercorp.com/zone: ${MLXP_ZONE}
      restartPolicy: Never
      terminationGracePeriodSeconds: 600
      volumes:
        - name: heartbeat
          emptyDir: {}
        - name: heavyedge-run
          emptyDir: {}
        - name: optuna-postgres-data
          emptyDir: {}
      initContainers:
        - name: check-monitor
          image: python:3.13
          imagePullPolicy: Always
          restartPolicy: Always
          workingDir: /sidecar
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: heartbeat
              mountPath: /heartbeat
            - name: heavyedge-run
              mountPath: /var/run/heavyedge
          startupProbe:
            exec:
              command: ["/usr/bin/test", "-f", "/heartbeat/sidecar-ready"]
            periodSeconds: 5
            failureThreshold: 60
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    cd /sidecar
                    for _ in $(seq 1 30); do
                      bash -euo pipefail .github/k8s/monitor-heartbeat.sh >/dev/null 2>&1 || true
                      [ -f /heartbeat/check-finalized ] && exit 0
                      sleep 1
                    done
          command: ["bash", "-euc"]
          args:
            - |
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates curl git openssl
              git init .
              if git remote get-url origin >/dev/null 2>&1; then
                git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
              else
                git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
              fi
              git fetch --depth 1 origin "${GIT_SHA}"
              git checkout --detach FETCH_HEAD
              git submodule update --init --recursive --depth 1

              if [ ! -f /heartbeat/check-started ]; then
                bash -euo pipefail .github/scripts/check-run.sh in_progress "" "Job has started"
                touch /heartbeat/check-started
              fi
              touch /heartbeat/sidecar-ready

              shutdown_monitor() {
                exit 0
              }
              trap shutdown_monitor TERM INT

              while true; do
                if ! bash -euo pipefail .github/k8s/monitor-heartbeat.sh; then
                  echo "Could not update the check run; retrying in 5 seconds." >&2
                fi
                sleep 5
              done
          envFrom:
            - secretRef:
                name: github-app
            - configMapRef:
                name: github-config
          env:
            - name: GIT_SHA
              value: "${GIT_SHA}"
        - name: optuna-postgres
          restartPolicy: Always
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1"
          command: ["/bin/sh", "-c"]
          args:
            - |
              postgres_pid=""
              shutdown_postgres() {
                if [ -n "$postgres_pid" ] && kill -0 "$postgres_pid" 2>/dev/null; then
                  kill -TERM "$postgres_pid" 2>/dev/null || true
                  wait "$postgres_pid" || true
                fi
                exit 0
              }
              trap shutdown_postgres TERM INT

              docker-entrypoint.sh postgres &
              postgres_pid=$!

              while kill -0 "$postgres_pid" 2>/dev/null; do
                if [ -f /var/run/heavyedge/deploy.done ]; then
                  shutdown_postgres
                fi
                sleep 2
              done

              wait "$postgres_pid" || true
          env:
            - name: POSTGRES_DB
              value: "optuna"
            - name: POSTGRES_USER
              value: "optuna"
            - name: POSTGRES_PASSWORD
              value: "optuna-local"
          volumeMounts:
            - name: optuna-postgres-data
              mountPath: /var/lib/postgresql/data
            - name: heavyedge-run
              mountPath: /var/run/heavyedge
        - name: optuna-dashboard
          restartPolicy: Always
          image: ghcr.io/optuna/optuna-dashboard:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "4Gi"
              cpu: "250m"
            limits:
              memory: "8Gi"
              cpu: "1"
          ports:
            - name: dashboard
              containerPort: 8080
          command: ["/bin/sh", "-c"]
          args:
            - |
              dashboard_pid=""
              shutdown_dashboard() {
                if [ -n "$dashboard_pid" ] && kill -0 "$dashboard_pid" 2>/dev/null; then
                  kill -TERM "$dashboard_pid" 2>/dev/null || true
                  wait "$dashboard_pid" || true
                fi
                exit 0
              }
              trap shutdown_dashboard TERM INT

              while [ ! -f /var/run/heavyedge/optuna.ready ] && [ ! -f /var/run/heavyedge/deploy.done ]; do
                sleep 2
              done

              while [ ! -f /var/run/heavyedge/deploy.done ]; do
                optuna-dashboard "$OPTUNA_DB" --host 0.0.0.0 --port 8080 &
                dashboard_pid=$!
                sleep 3
                if kill -0 "$dashboard_pid" 2>/dev/null; then
                  break
                fi
                wait "$dashboard_pid" || true
                sleep 2
              done

              while [ ! -f /var/run/heavyedge/deploy.done ]; do
                sleep 2
              done

              shutdown_dashboard
          env:
            - name: OPTUNA_DB
              value: "postgresql+psycopg2://optuna:optuna-local@127.0.0.1:5432/optuna"
          volumeMounts:
            - name: heavyedge-run
              mountPath: /var/run/heavyedge
      containers:
        - name: build
          image: python:3.13
          imagePullPolicy: Always
          workingDir: /workspace
          volumeMounts:
            - name: heartbeat
              mountPath: /heartbeat
            - name: heavyedge-run
              mountPath: /var/run/heavyedge
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    if [ ! -f /heartbeat/build-success ] && \
                       [ ! -f /heartbeat/build-failure ]; then
                      touch /heartbeat/build-cancelled
                    fi
          resources:
            requests:
              memory: "${MEMORY_REQUEST}"
              cpu: "${CPU_REQUEST}"
              nvidia.com/gpu: "${GPU_REQUEST}"
            limits:
              memory: "${MEMORY_REQUEST}"
              cpu: "${CPU_REQUEST}"
              nvidia.com/gpu: "${GPU_REQUEST}"
          command: ["bash", "-euc"]
          args:
            - |
              heartbeat_dir=/heartbeat
              current_step_file="$heartbeat_dir/current-step"

              set_current_step() {
                printf '%s\n' "$1" > "$current_step_file"
              }

              set_current_step "Container setup"
              touch "$heartbeat_dir/build-started"
              while true; do
                touch "$heartbeat_dir/heartbeat"
                sleep 15
              done &
              heartbeat_pid=$!

              mark_check_as_failed() {
                exit_code=$?
                trap - ERR
                printf '%s\n' "$exit_code" > "$heartbeat_dir/failure-exit-code"
                kill "$heartbeat_pid" 2>/dev/null || true
                touch "$heartbeat_dir/build-failure"
                for _ in $(seq 1 60); do
                  [ -f "$heartbeat_dir/check-finalized" ] && break
                  sleep 1
                done
                exit "$exit_code"
              }
              trap mark_check_as_failed ERR

              update_check() {
                local check_title
                check_title="$3"
                if ! bash -euo pipefail .github/scripts/check-run.sh "$@"; then
                  echo "Could not update the check run: $check_title" >&2
                  return 1
                fi
              }

              run_step() {
                local step_name exit_code
                step_name="$1"
                shift
                set_current_step "$step_name"

                if [ -f .github/scripts/check-run.sh ]; then
                  update_check in_progress "" "${step_name} started" || true
                fi

                if "$@"; then
                  if [ -f .github/scripts/check-run.sh ]; then
                    update_check in_progress "" "${step_name} succeeded" || true
                  fi
                  return 0
                else
                  exit_code=$?
                fi

                printf '%s\n' "$exit_code" > "$heartbeat_dir/failure-exit-code"
                if [ -f .github/scripts/check-run.sh ] && \
                   update_check completed failure "${step_name} failed" \
                     "${step_name} exited with status ${exit_code}."; then
                  touch "$heartbeat_dir/check-finalized"
                fi
                return "$exit_code"
              }

              run_nonfatal_step() {
                local step_name exit_code
                step_name="$1"
                shift
                set_current_step "$step_name"

                if [ -f .github/scripts/check-run.sh ]; then
                  update_check in_progress "" "${step_name} started" || true
                fi

                if "$@"; then
                  if [ -f .github/scripts/check-run.sh ]; then
                    update_check in_progress "" "${step_name} succeeded" || true
                  fi
                  return 0
                else
                  exit_code=$?
                fi

                printf '%s\n' "$exit_code" > "$heartbeat_dir/failure-exit-code"
                if [ -f .github/scripts/check-run.sh ]; then
                  update_check in_progress "" "${step_name} failed; continuing" \
                    "${step_name} exited with status ${exit_code}." || true
                fi
                return "$exit_code"
              }

              install_dependencies() {
                apt-get update || return $?
                apt-get install -y --no-install-recommends \
                  ca-certificates curl git gzip openssl tar || return $?
              }

              checkout_source() {
                git init . || return $?
                git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git" || return $?
                git fetch --depth 1 origin "${GIT_SHA}" || return $?
                git checkout --detach FETCH_HEAD || return $?
                git submodule update --init --recursive --depth 1 || return $?
              }

              set_major_version() {
                MAJOR_VERSION="$(python3 .github/k8s/major-version.py)" || return $?
                export MAJOR_VERSION
              }

              run_step "Container setup" install_dependencies
              run_step "Source checkout" checkout_source

              pip install uv
              run_step "Build environment setup" bash -euo pipefail ./setup.sh
              run_step "Setup PostgreSQL" bash -euo pipefail .github/k8s/setup-postgres.sh

              if [ "$GITHUB_EVENT_NAME" = "release" ]; then
                run_step "Parse version" set_major_version
              fi
              pip install -r requirements.txt -r examples/requirements.txt
              run_step "Build" bash -euo pipefail .github/k8s/build.sh

              post_build_exit_code=0
              if run_nonfatal_step "Benchmark database export" \
                bash -euo pipefail .github/k8s/export-db.sh \
                  "$OPTUNA_DB" "benchmarks/optuna.db"; then
                :
              else
                post_build_exit_code=$?
              fi

              if [ "$GITHUB_EVENT_NAME" = "release" ]; then
                if run_nonfatal_step "Hugging Face deployment" \
                  bash -euo pipefail .github/k8s/retry.sh --attempts 3 --sleep 60 "Hugging Face deployment" \
                    bash -euo pipefail .github/k8s/upload-huggingface.sh; then
                  :
                else
                  step_exit_code=$?
                  if [ "$post_build_exit_code" -eq 0 ]; then
                    post_build_exit_code="$step_exit_code"
                  fi
                fi
                if run_nonfatal_step "Examples artifact upload" \
                  bash -euo pipefail .github/k8s/retry.sh --attempts 3 --sleep 60 "Examples artifact upload" \
                    bash -euo pipefail .github/k8s/upload-artifact.sh examples; then
                  :
                else
                  step_exit_code=$?
                  if [ "$post_build_exit_code" -eq 0 ]; then
                    post_build_exit_code="$step_exit_code"
                  fi
                fi
                if run_nonfatal_step "Benchmarks artifact upload" \
                  bash -euo pipefail .github/k8s/retry.sh --attempts 3 --sleep 60 "Benchmarks artifact upload" \
                    bash -euo pipefail .github/k8s/upload-artifact.sh benchmarks; then
                  :
                else
                  step_exit_code=$?
                  if [ "$post_build_exit_code" -eq 0 ]; then
                    post_build_exit_code="$step_exit_code"
                  fi
                fi
              fi

              set_current_step "Finalizing job"
              if [ "$post_build_exit_code" -ne 0 ]; then
                if update_check completed failure "Post-build task failed" \
                     "One or more post-build tasks failed."; then
                  touch "$heartbeat_dir/check-finalized"
                fi
                bash -euo pipefail .github/k8s/heartbeat.sh finish failure "$heartbeat_pid"
                exit "$post_build_exit_code"
              fi
              if update_check completed success "Build completed successfully" \
                   "All build-container steps completed successfully."; then
                touch "$heartbeat_dir/check-finalized"
              fi
              bash -euo pipefail .github/k8s/heartbeat.sh finish success "$heartbeat_pid"
          envFrom:
            - secretRef:
                name: github-app
            - secretRef:
                name: huggingface-token
            - configMapRef:
                name: github-config
          env:
            - name: GIT_SHA
              value: "${GIT_SHA}"
            - name: OPTUNA_DB
              value: "postgresql+psycopg2://optuna:optuna-local@127.0.0.1:5432/optuna"
