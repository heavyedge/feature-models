apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: ${KUBE_NAMESPACE}
  annotations:
    creator: "${KUBE_USERNAME}"
spec:
  ttlSecondsAfterFinished: ${TTL_SECONDS_AFTER_FINISHED}
  backoffLimit: 0
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
        creator: "${KUBE_USERNAME}"
    spec:
      nodeSelector:
          mlx.navercorp.com/zone: ${MLXP_ZONE}
      restartPolicy: Never
      terminationGracePeriodSeconds: 600
      volumes:
        - name: heartbeat
          emptyDir: {}
        - name: optuna-postgres-data
          emptyDir: {}
      initContainers:
        - name: check-monitor
          image: python:3.13
          imagePullPolicy: Always
          restartPolicy: Always
          workingDir: /sidecar
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: heartbeat
              mountPath: /heartbeat
          startupProbe:
            exec:
              command: ["/usr/bin/test", "-f", "/heartbeat/sidecar-ready"]
            periodSeconds: 5
            failureThreshold: 60
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    cd /sidecar
                    bash -euo pipefail .github/k8s/monitor-heartbeat.sh >/dev/null 2>&1 &
          command: ["bash", "-euc"]
          args:
            - |
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates curl git openssl
              git init .
              git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
              git fetch --depth 1 origin "${GIT_SHA}"
              git checkout --detach FETCH_HEAD
              git submodule update --init --recursive --depth 1

              if [ ! -f /heartbeat/check-started ]; then
                bash -euo pipefail .github/scripts/check-run.sh in_progress "" "Job has started"
                touch /heartbeat/check-started
              fi
              touch /heartbeat/sidecar-ready

              shutdown_monitor() {
                exit 0
              }
              trap shutdown_monitor TERM INT

              while true; do
                bash -euo pipefail .github/k8s/monitor-heartbeat.sh
                sleep 5
              done
          envFrom:
            - secretRef:
                name: github-app
            - configMapRef:
                name: github-config
          env:
            - name: GIT_SHA
              value: "${GIT_SHA}"
        - name: optuna-postgres
          restartPolicy: Always
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1"
          command: ["/bin/sh", "-c"]
          args:
            - |
              postgres_pid=""
              shutdown_postgres() {
                if [ -n "$postgres_pid" ] && kill -0 "$postgres_pid" 2>/dev/null; then
                  kill -TERM "$postgres_pid" 2>/dev/null || true
                  wait "$postgres_pid" || true
                fi
                exit 0
              }
              trap shutdown_postgres TERM INT

              docker-entrypoint.sh postgres &
              postgres_pid=$!

              while kill -0 "$postgres_pid" 2>/dev/null; do
                if [ -f /var/run/heavyedge/deploy.done ]; then
                  shutdown_postgres
                fi
                sleep 2
              done

              wait "$postgres_pid" || true
          env:
            - name: POSTGRES_DB
              value: "optuna"
            - name: POSTGRES_USER
              value: "optuna"
            - name: POSTGRES_PASSWORD
              value: "optuna-local"
          volumeMounts:
            - name: optuna-postgres-data
              mountPath: /var/lib/postgresql/data
        - name: optuna-dashboard
          restartPolicy: Always
          image: ghcr.io/optuna/optuna-dashboard:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "4Gi"
              cpu: "250m"
            limits:
              memory: "8Gi"
              cpu: "1"
          ports:
            - name: dashboard
              containerPort: 8080
          command: ["/bin/sh", "-c"]
          args:
            - |
              dashboard_pid=""
              shutdown_dashboard() {
                if [ -n "$dashboard_pid" ] && kill -0 "$dashboard_pid" 2>/dev/null; then
                  kill -TERM "$dashboard_pid" 2>/dev/null || true
                  wait "$dashboard_pid" || true
                fi
                exit 0
              }
              trap shutdown_dashboard TERM INT

              while [ ! -f /var/run/heavyedge/optuna.ready ] && [ ! -f /var/run/heavyedge/deploy.done ]; do
                sleep 2
              done

              while [ ! -f /var/run/heavyedge/deploy.done ]; do
                optuna-dashboard "$OPTUNA_DB" --host 0.0.0.0 --port 8080 &
                dashboard_pid=$!
                sleep 3
                if kill -0 "$dashboard_pid" 2>/dev/null; then
                  break
                fi
                wait "$dashboard_pid" || true
                sleep 2
              done

              while [ ! -f /var/run/heavyedge/deploy.done ]; do
                sleep 2
              done

              shutdown_dashboard
          env:
            - name: OPTUNA_DB
              value: "postgresql+psycopg2://optuna:optuna-local@127.0.0.1:5432/optuna"
      containers:
        - name: build
          image: python:3.13
          imagePullPolicy: Always
          workingDir: /workspace
          volumeMounts:
            - name: heartbeat
              mountPath: /heartbeat
          lifecycle:
            preStop:
              exec:
                command:
                  - /usr/bin/touch
                  - /heartbeat/build-cancelled
          resources:
            requests:
              memory: "16Gi"
              cpu: "${CPU_REQUEST}"
              nvidia.com/gpu: "${GPU_REQUEST}"
            limits:
              memory: "16Gi"
              cpu: "${CPU_REQUEST}"
              nvidia.com/gpu: "${GPU_REQUEST}"
          command: ["bash", "-euc"]
          args:
            - |
              bash -euo pipefail .github/k8s/heartbeat.sh start &
              heartbeat_pid=$!

              mark_check_as_failed() {
                exit_code=$?
                trap - ERR
                bash -euo pipefail .github/k8s/heartbeat.sh finish failure "$heartbeat_pid" || true
                exit "$exit_code"
              }
              trap mark_check_as_failed ERR

              apt-get update
              apt-get install -y --no-install-recommends ca-certificates curl git gzip openssl tar
              git init .
              git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
              git fetch --depth 1 origin "${GIT_SHA}"
              git checkout --detach FETCH_HEAD
              git submodule update --init --recursive --depth 1

              sh .github/k8s/build.sh

              bash -euo pipefail .github/k8s/heartbeat.sh finish success "$heartbeat_pid"
          envFrom:
            - secretRef:
                name: github-app
            - secretRef:
                name: huggingface-token
            - configMapRef:
                name: github-config
          env:
            - name: GIT_SHA
              value: "${GIT_SHA}"
            - name: OPTUNA_DB
              value: "postgresql+psycopg2://optuna:optuna-local@127.0.0.1:5432/optuna"
